<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concept Ladder</title>
    <link rel="icon" href="{{ url_for('static', filename='images/favicon.svg') }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script>document.documentElement.dataset.theme = localStorage.getItem('theme') || 'light';</script>
    <style>
        /* Student handset view: one question, thumb-sized targets, nothing else.
           Same family as the exam surface — violet-tinted ground, system tokens. */
        :root {
            --bg: #f7f5fd; --bg-elevated: #ffffff; --text: #1a1a1a; --text-light: #6b7280;
            --border: #e5e7eb; --primary: #8366e8; --primary-dark: #6b52cc;
            --primary-soft: rgba(131,102,232,0.10);
            --teal: #10b981; --teal-soft: rgba(16,185,129,0.12); --teal-ink: #047857;
            --amber-soft: rgba(245,158,11,0.12); --amber-ink: #b45309;
            --red: #ef4444; --red-soft: rgba(239,68,68,0.10); --red-ink: #b91c1c;
            --radius: 12px; --radius-sm: 8px;
        }
        [data-theme="dark"] {
            --bg: #121319; --bg-elevated: #17181f; --text: #ececf1; --text-light: #9a9aa8;
            --border: #262833; --primary: #9d84ff; --primary-dark: #8366e8;
            --primary-soft: rgba(157,132,255,0.14);
            --teal: #34d399; --teal-soft: rgba(52,211,153,0.14); --teal-ink: #34d399;
            --amber-soft: rgba(251,191,36,0.14); --amber-ink: #fbbf24;
            --red: #f87171; --red-soft: rgba(248,113,113,0.14); --red-ink: #f87171;
            color-scheme: dark;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg); color: var(--text); line-height: 1.5; min-height: 100vh;
        }
        .pl-top {
            position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center;
            padding: 0.8rem 1.1rem; background: var(--bg-elevated); border-bottom: 1px solid var(--border);
            font-size: 0.85rem; font-weight: 700;
        }
        .pl-top .meta { color: var(--text-light); font-weight: 600; font-variant-numeric: tabular-nums; }
        .pl-timer { font-variant-numeric: tabular-nums; font-size: 1.1rem; font-weight: 800; }
        .pl-timer.low { color: var(--red); }

        .pl-wrap { max-width: 560px; margin: 0 auto; padding: 1.2rem 1rem 3rem; }

        .pl-wait { text-align: center; padding: 4rem 1rem; color: var(--text-light); }
        .pl-wait h2 { color: var(--text); font-size: 1.2rem; margin: 0 0 0.4rem; }
        .pl-dotrow { display: inline-flex; gap: 6px; margin-top: 1.2rem; }
        .pl-dotrow span { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); opacity: 0.35; animation: plWave 1.2s ease-in-out infinite; }
        .pl-dotrow span:nth-child(2) { animation-delay: 0.15s; }
        .pl-dotrow span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes plWave { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }

        .pl-qmeta { display: flex; gap: 0.5rem; margin-bottom: 0.8rem; }
        .pl-pill { font-size: 0.7rem; font-weight: 700; padding: 0.18rem 0.6rem; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.04em; background: var(--primary-soft); color: var(--primary); }
        .pl-qtext { font-size: 1.15rem; font-weight: 600; white-space: pre-wrap; margin-bottom: 1.2rem; }

        .pl-option {
            display: flex; align-items: center; gap: 0.75rem; width: 100%; text-align: left;
            padding: 0.95rem 1rem; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
            background: var(--bg-elevated); color: var(--text); font-family: inherit; font-size: 1rem;
            margin-bottom: 0.6rem; cursor: pointer; transition: border-color 150ms ease, background 150ms ease;
        }
        .pl-option:hover { border-color: var(--primary); background: var(--primary-soft); }
        .pl-option:disabled { cursor: default; }
        .pl-option .letter {
            width: 1.8rem; height: 1.8rem; border-radius: 50%; background: var(--primary-soft); color: var(--primary);
            display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.85rem; flex-shrink: 0;
        }
        .pl-option.mine { border-color: var(--primary); background: var(--primary-soft); font-weight: 600; }
        .pl-option.correct { border-color: var(--teal); background: var(--teal-soft); }
        .pl-option.correct .letter { background: var(--teal); color: #fff; }
        .pl-option.mine-wrong { border-color: var(--red); background: var(--red-soft); }

        .pl-status { text-align: center; margin-top: 1rem; padding: 0.8rem; border-radius: var(--radius-sm); font-weight: 700; font-size: 0.95rem; }
        .pl-status.ok { background: var(--teal-soft); color: var(--teal-ink); }
        .pl-status.locked { background: var(--primary-soft); color: var(--primary); }
        .pl-status.right { background: var(--teal-soft); color: var(--teal-ink); }
        .pl-status.wrong { background: var(--amber-soft); color: var(--amber-ink); }

        .pl-done { text-align: center; padding: 4rem 1rem; }
        .pl-done h2 { font-size: 1.4rem; margin: 0 0 0.5rem; }
        .pl-done a { color: var(--primary); font-weight: 700; text-decoration: none; }

        @media (prefers-reduced-motion: reduce) {
            .pl-dotrow span { animation: none; opacity: 0.7; }
            .pl-option { transition: none; }
        }
    </style>
</head>
<body>
    <div class="pl-top">
        <span>Concept Ladder</span>
        <span class="meta" id="meta"></span>
        <span class="pl-timer" id="timer" hidden></span>
    </div>
    <div class="pl-wrap" id="stage"></div>

<script>
const STATE_URL = "{{ url_for('games.play_state', session_id=session_obj.id) }}";
const ANSWER_URL = "{{ url_for('games.play_answer', session_id=session_obj.id) }}";
const HOME_URL = "{{ url_for('concept_chains.games_hub') }}";
let S = null;
let submitting = false;
let timerHandle = null;
const LETTERS = "ABCDEFGH";

function esc(t) { const d = document.createElement("div"); d.textContent = t == null ? "" : String(t); return d.innerHTML; }

async function answer(i) {
    if (submitting || !S || S.answered) return;
    submitting = true;
    try {
        const res = await fetch(ANSWER_URL, {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ answer_index: i })
        });
        if (res.ok) { S.answered = true; S.my_answer = i; render(); }
    } finally { submitting = false; }
    refresh();
}

function waitHTML(title, sub) {
    return `<div class="pl-wait"><h2>${title}</h2><div>${sub}</div>
        <div class="pl-dotrow"><span></span><span></span><span></span></div></div>`;
}

function stageHTML() {
    if (!S) return "";
    if (S.phase === "lobby") return waitHTML("You're in", "Eyes on the board — the climb starts soon.");
    if (S.phase === "finished") {
        return `<div class="pl-done"><h2>Climb over</h2>
            <p><a href="${HOME_URL}">Back to games</a></p></div>`;
    }
    const q = S.question;
    if (!q) return waitHTML("Sit tight", "No question for you on this rung.");

    const reveal = S.phase === "rung_reveal";
    const options = q.options.map((opt, i) => {
        let cls = "";
        if (reveal) {
            if ((q.correct || []).includes(i)) cls = "correct";
            else if (S.my_answer === i) cls = "mine-wrong";
        } else if (S.my_answer === i) cls = "mine";
        return `<button class="pl-option ${cls}" ${S.answered || reveal ? "disabled" : ""}
            onclick="answer(${i})"><span class="letter">${LETTERS[i]}</span><span>${esc(opt)}</span></button>`;
    }).join("");

    let status = "";
    if (reveal) {
        if (S.my_correct === true) status = `<div class="pl-status right">You got it</div>`;
        else if (S.my_correct === false) status = `<div class="pl-status wrong">Not this time — the green answer is the one</div>`;
    } else if (S.answered) {
        status = `<div class="pl-status locked">Answer locked in — watch the board</div>`;
    }

    return `<div class="pl-qmeta">
            <span class="pl-pill">Rung ${S.rung_index + 1}/${S.rung_count}</span>
            ${S.attempt > 1 ? `<span class="pl-pill">2nd attempt</span>` : ""}
            ${q.is_hl ? `<span class="pl-pill">HL</span>` : ""}
        </div>
        <div class="pl-qtext">${esc(q.text)}</div>
        ${options}${status}`;
}

function renderTimer() {
    const el = document.getElementById("timer");
    if (!S || S.phase !== "rung_open" || !S.opened_at || S.answered) { el.hidden = true; clearInterval(timerHandle); return; }
    const opened = new Date(S.opened_at).getTime();
    const skew = Date.now() - new Date(S.server_now).getTime();
    const endsAt = opened + S.seconds_per_rung * 1000 + skew;
    el.hidden = false;
    clearInterval(timerHandle);
    const tick = () => {
        const left = Math.max(0, Math.round((endsAt - Date.now()) / 1000));
        el.textContent = String(Math.floor(left / 60)) + ":" + String(left % 60).padStart(2, "0");
        el.classList.toggle("low", left <= 10 && left > 0);
        if (left <= 0) clearInterval(timerHandle);
    };
    tick();
    timerHandle = setInterval(tick, 500);
}

function render() {
    document.getElementById("stage").innerHTML = stageHTML();
    document.getElementById("meta").textContent = !S ? "" :
        S.phase === "lobby" ? "waiting" :
        S.phase === "finished" ? "finished" : `rung ${S.rung_index + 1} of ${S.rung_count}`;
    renderTimer();
}

let lastKey = "";
async function refresh() {
    try {
        const res = await fetch(STATE_URL);
        if (!res.ok) return;
        const next = await res.json();
        // Re-render only when something the student sees changed — avoids
        // wiping button focus mid-tap on every poll.
        const key = JSON.stringify([next.phase, next.rung_index, next.attempt,
                                    next.answered, next.my_correct]);
        S = next;
        if (key !== lastKey) { lastKey = key; render(); }
    } catch (e) { /* transient — next poll wins */ }
}
refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
