<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .auth-body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg-light); }
        .auth-card { background: var(--bg-white); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 2rem; width: 100%; max-width: 420px; }
        .auth-card h1 { font-size: 1.4rem; margin: 0 0 1.25rem; text-align: center; background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .auth-field { margin-bottom: 1rem; }
        .auth-field label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.3rem; }
        .auth-field input { width: 100%; padding: 0.65rem 0.85rem; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; box-sizing: border-box; background: var(--bg-light); color: var(--text-dark); transition: all 0.2s; }
        .auth-field input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(131, 102, 232, 0.15); background: var(--bg-white); }
        .auth-submit { width: 100%; padding: 0.65rem; border: none; border-radius: 6px; background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary-dark) 100%); color: #fff; font-weight: 600; cursor: pointer; margin-top: 0.5rem; transition: all 0.2s; }
        .auth-submit:hover { box-shadow: 0 6px 20px rgba(131, 102, 232, 0.4); transform: translateY(-2px); }
        .auth-flash { background: #fee2e2; color: #991b1b; padding: 0.6rem 0.8rem; border-radius: 6px; font-size: 0.85rem; margin-bottom: 1rem; border-left: 4px solid #d92916; }
        .auth-footer { text-align: center; margin-top: 1rem; font-size: 0.85rem; }
        .auth-footer a { color: var(--primary); text-decoration: none; font-weight: 600; }
        .auth-footer a:hover { text-decoration: underline; }
        .auth-theme-toggle {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            background: transparent;
            border: 1px solid var(--border);
            cursor: pointer;
            padding: 0.5rem 0.65rem;
            border-radius: 6px;
            transition: all 0.2s ease;
            font-size: 1rem;
            color: var(--text-dark);
        }
        .auth-theme-toggle:hover {
            background: rgba(131, 102, 232, 0.15);
            border-color: var(--primary);
            color: var(--primary);
        }
    </style>
</head>
<body class="auth-body">
    <button id="themeToggle" class="auth-theme-toggle" title="Toggle dark mode">🌙</button>
    <div class="auth-card">
        <h1>Create Your Account</h1>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for m in messages %}<div class="auth-flash">{{ m }}</div>{% endfor %}
            {% endif %}
        {% endwith %}
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="auth-field">
                <label>Username</label>
                <input type="text" name="username" value="{{ username or '' }}" autocomplete="username"
                       pattern="[A-Za-z0-9._\-]{3,80}" title="3–80 characters: letters, numbers, dots, dashes or underscores" required autofocus>
                <small style="color:var(--text-light);">Please don't use your real name.</small>
            </div>
            <div class="auth-field">
                <label>Signup code</label>
                <input type="text" name="signup_code" autocomplete="off" required>
            </div>
            <div class="auth-field">
                <label>Password</label>
                <input type="password" name="password" minlength="8" required>
            </div>
            <div class="auth-field">
                <label>Confirm Password</label>
                <input type="password" name="confirm_password" minlength="8" required>
            </div>
            <button type="submit" class="auth-submit">Sign Up</button>
        </form>
        <div class="auth-footer">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></div>
    </div>
    <script>
        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.dataset.theme = savedTheme;
            updateThemeToggle();
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.dataset.theme || 'light';
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.dataset.theme = newTheme;
            localStorage.setItem('theme', newTheme);
            updateThemeToggle();
        }

        function updateThemeToggle() {
            const toggleBtn = document.getElementById('themeToggle');
            const isDark = document.documentElement.dataset.theme === 'dark';
            toggleBtn.textContent = isDark ? '☀️' : '🌙';
        }

        document.getElementById('themeToggle').addEventListener('click', toggleTheme);
        document.addEventListener('DOMContentLoaded', initTheme);
        initTheme();
    </script>
</body>
</html>
