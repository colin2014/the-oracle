{% extends "admin_base.html" %}

{% block title %}Report Cards{% endblock %}

{% block content %}
<div class="report-card-container">
  <div class="report-card-split">
    <!-- Left panel: Student list -->
    <div class="student-list-panel">
      <div class="student-list-header">
        <h2>Students</h2>
        <input
          type="text"
          id="studentSearch"
          class="search-input"
          placeholder="Search by name, username, or email..."
        >
      </div>

      <div class="student-list" id="studentList">
        <div class="loading">Loading students...</div>
      </div>

      <div class="pagination" id="pagination" style="display: none;">
        <button id="prevBtn" class="btn-secondary"><svg class="rpt-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg> Previous</button>
        <span id="pageInfo"></span>
        <button id="nextBtn" class="btn-secondary">Next <svg class="rpt-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
      </div>
    </div>

    <!-- Right panel: Report card view -->
    <div class="report-card-panel">
      <div id="reportCardContent" class="report-card-content">
        <div class="empty-state">
          <p>Select a student to view their report card</p>
        </div>
      </div>
    </div>
  </div>
</div>

<style>
.report-card-container {
  display: flex;
  height: calc(100vh - 120px);
  gap: 1px;
  background: #e0e0e0;
  padding: 1rem;
}

.report-card-split {
  display: flex;
  width: 100%;
  gap: 1px;
  background: #e0e0e0;
}

.student-list-panel {
  flex: 0 0 320px;
  background: white;
  border-radius: 8px 0 0 8px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.student-list-header {
  padding: 1.5rem;
  border-bottom: 1px solid #e0e0e0;
}

.student-list-header h2 {
  margin: 0 0 1rem 0;
  font-size: 1.25rem;
}

.search-input {
  width: 100%;
  padding: 0.75rem;
  border: 1px solid #ddd;
  border-radius: 4px;
  font-size: 0.95rem;
  box-sizing: border-box;
}

.student-list {
  flex: 1;
  overflow-y: auto;
  padding: 0;
}

.student-item {
  padding: 1rem 1.5rem;
  border-bottom: 1px solid #f0f0f0;
  cursor: pointer;
  transition: background 0.2s;
}

.student-item:hover {
  background: #f5f5f5;
}

.student-item.active {
  background: #e3f2fd;
  border-left: 4px solid #2196F3;
  padding-left: calc(1.5rem - 4px);
}

.student-name {
  font-weight: 600;
  margin: 0 0 0.25rem 0;
  color: #333;
}

.student-meta {
  font-size: 0.85rem;
  color: #666;
  margin: 0;
}

.pagination {
  padding: 1rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-top: 1px solid #e0e0e0;
}

.report-card-panel {
  flex: 1;
  background: white;
  border-radius: 0 8px 8px 0;
  overflow-y: auto;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.report-card-content {
  padding: 2rem;
  max-width: 900px;
}

.empty-state {
  text-align: center;
  color: #999;
  padding: 4rem 2rem;
}

/* Report Header */
.report-header {
  margin-bottom: 2rem;
  padding-bottom: 1.5rem;
  border-bottom: 3px solid #e3f2fd;
}

.student-name-large {
  font-size: 2rem;
  font-weight: 700;
  margin: 0 0 0.5rem 0;
  color: #333;
}

.report-date {
  font-size: 0.9rem;
  color: #999;
}

/* Overall Summary Section */
.summary-section {
  background: linear-gradient(135deg, #f5f7fa 0%, #e9ecef 100%);
  border-left: 5px solid #2196F3;
  padding: 1.5rem;
  border-radius: 8px;
  margin-bottom: 2rem;
}

.summary-title {
  font-size: 0.9rem;
  font-weight: 700;
  text-transform: uppercase;
  color: #2196F3;
  margin-bottom: 0.75rem;
  letter-spacing: 0.5px;
}

.summary-text {
  font-size: 1.05rem;
  line-height: 1.7;
  color: #333;
  margin: 0;
}

/* Performance Overview Cards */
.performance-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 1rem;
  margin-bottom: 2rem;
}

.performance-card {
  background: white;
  border: 2px solid #e0e0e0;
  border-radius: 8px;
  padding: 1.5rem;
  transition: all 0.3s ease;
}

.performance-card:hover {
  border-color: #2196F3;
  box-shadow: 0 4px 12px rgba(33, 150, 243, 0.15);
}

.performance-card.success { border-left: 5px solid #4CAF50; }
.performance-card.info { border-left: 5px solid #2196F3; }
.performance-card.warning { border-left: 5px solid #FF9800; }
.performance-card.danger { border-left: 5px solid #f44336; }

.performance-label {
  font-size: 0.85rem;
  font-weight: 600;
  color: #666;
  text-transform: uppercase;
  margin-bottom: 0.5rem;
  letter-spacing: 0.3px;
}

.performance-value {
  font-size: 2.2rem;
  font-weight: 700;
  margin: 0 0 0.25rem 0;
}

.performance-value.success { color: #4CAF50; }
.performance-value.info { color: #2196F3; }
.performance-value.warning { color: #FF9800; }
.performance-value.danger { color: #f44336; }

.performance-status {
  font-size: 0.8rem;
  color: #999;
  margin-top: 0.5rem;
}

/* Sections */
.report-section {
  margin-bottom: 2.5rem;
  page-break-inside: avoid;
}

.section-header {
  font-size: 1.3rem;
  font-weight: 700;
  margin: 0 0 1.25rem 0;
  padding-bottom: 0.75rem;
  border-bottom: 3px solid #e3f2fd;
  color: #333;
}

.section-header .emoji {
  margin-right: 0.5rem;
}

/* Strengths & Areas for Growth Lists */
.achievement-list,
.growth-list {
  list-style: none;
  padding: 0;
  margin: 0;
}

.achievement-item,
.growth-item {
  background: white;
  border: 1px solid #e0e0e0;
  border-left: 4px solid #4CAF50;
  padding: 1rem;
  margin-bottom: 0.75rem;
  border-radius: 4px;
  line-height: 1.6;
  color: #333;
}

.growth-item {
  border-left-color: #FF9800;
}

.pdf-controls { display: flex; align-items: flex-end; gap: 0.6rem; }
.pdf-name-field { display: flex; flex-direction: column; gap: 0.2rem; }
.pdf-name-field span {
  font-size: 0.65rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.04em; color: #888;
}
.pdf-name-field input {
  font: inherit; font-size: 0.85rem; color: #333;
  border: 1px solid #ccc; border-radius: 6px; padding: 0.4rem 0.55rem; min-width: 13rem;
}
.pdf-name-field input:focus {
  outline: 2px solid #8366e8; outline-offset: -1px; border-color: #8366e8;
}

/* Ghost tier: rewriting is a secondary action next to Download PDF, and it
   spends an API call, so it shouldn't compete with the primary button. */
.btn-regenerate {
  display: inline-flex; align-items: center; gap: 0.4rem;
  background: transparent; color: #1a1a1a;
  border: 1px solid rgba(131, 102, 232, 0.5); border-radius: 6px;
  padding: 0.55rem 0.9rem; font: inherit; font-size: 0.85rem; font-weight: 600;
  cursor: pointer; transition: background 0.15s ease, border-color 0.15s ease;
}
.btn-regenerate:hover { background: rgba(131, 102, 232, 0.08); border-color: #8366e8; }
.btn-regenerate:disabled { opacity: 0.55; cursor: default; }

.achievement-item > .rpt-icon { color: #4CAF50; }
.growth-item > .rpt-icon { color: #FF9800; }

/* Drawn icons, never emoji — see report_icons.py. Emoji also make the PDF
   renderer scan every system font, which cost ~44s per export. */
.rpt-icon {
  flex: 0 0 auto;
  vertical-align: -0.15em;
  margin-right: 0.4rem;
}

/* Action Items */
.action-list {
  list-style: none;
  padding: 0;
  margin: 0;
}

.action-item {
  background: #f0f7ff;
  border-left: 4px solid #2196F3;
  padding: 1rem;
  margin-bottom: 0.75rem;
  border-radius: 4px;
  line-height: 1.6;
  color: #333;
}

.action-number {
  display: inline-block;
  background: #2196F3;
  color: white;
  width: 24px;
  height: 24px;
  line-height: 24px;
  text-align: center;
  border-radius: 50%;
  font-size: 0.75rem;
  font-weight: 700;
  margin-right: 0.75rem;
}

/* Teacher Note */
.teacher-note {
  background: linear-gradient(135deg, #fff3e0 0%, #ffe0b2 100%);
  border-left: 5px solid #FF9800;
  padding: 1.5rem;
  border-radius: 8px;
  line-height: 1.7;
  color: #333;
  margin-top: 2rem;
}

.teacher-note-label {
  font-weight: 700;
  color: #FF9800;
  margin-bottom: 0.5rem;
  font-size: 0.9rem;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}

.teacher-note-text {
  margin: 0;
  color: #333;
}

/* Info Boxes */
.info-box {
  background: #f8f9fa;
  border: 1px solid #e9ecef;
  border-left: 4px solid #2196F3;
  padding: 1.25rem;
  border-radius: 4px;
  margin: 0;
}

/* Green rather than the neutral info blue: this is the section the student is
   most likely to reread, so it should read as good news. */
.went-well-box {
  background: #f2faf3;
  border: 1px solid #d9ecdb;
  border-left: 4px solid #4CAF50;
  padding: 1.25rem;
  border-radius: 4px;
  margin: 0;
}

.info-text {
  margin: 0;
  line-height: 1.7;
  color: #333;
  font-size: 1rem;
}

.info-box strong {
  color: #2196F3;
  font-weight: 600;
}

/* Buttons */
.btn-secondary {
  background: #f0f0f0;
  color: #333;
  border: 1px solid #ddd;
  padding: 0.5rem 1rem;
  border-radius: 4px;
  cursor: pointer;
  transition: background 0.2s;
}

.btn-secondary:hover {
  background: #e0e0e0;
}

.btn-secondary:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.btn-pdf {
  background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%);
  color: white;
  border: none;
  padding: 0.75rem 1.5rem;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 600;
  font-size: 0.95rem;
  transition: all 0.3s ease;
  box-shadow: 0 2px 8px rgba(33, 150, 243, 0.3);
}

.btn-pdf:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(33, 150, 243, 0.4);
}

.btn-pdf:disabled {
  opacity: 0.7;
  cursor: not-allowed;
  transform: none;
}

.loading {
  padding: 2rem;
  text-align: center;
  color: #999;
}

.loading-spinner {
  display: inline-block;
  width: 20px;
  height: 20px;
  border: 3px solid #f0f0f0;
  border-top: 3px solid #2196F3;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

/* Print Styles */
@media print {
  .student-list-panel, .pagination, .empty-state {
    display: none;
  }

  .report-card-split {
    gap: 0;
  }

  .report-card-panel {
    flex: 1;
    border-radius: 0;
    box-shadow: none;
  }

  .report-card-content {
    max-width: 100%;
  }
}

@media (max-width: 1200px) {
  .report-card-split {
    flex-direction: column;
  }

  .student-list-panel {
    flex: 0 0 auto;
    max-height: 400px;
    border-radius: 8px 8px 0 0;
  }

  .report-card-panel {
    flex: 1;
    border-radius: 0 0 8px 8px;
  }
}
</style>

<script>
const AVATAR_EMOJI = {{ AVATAR_BY_KEY | tojson }};
function avatarHtml(key, size) {
  size = size || 24;
  const a = AVATAR_EMOJI[key];
  const emoji = a ? a.emoji : '';
  return `<span style="display:inline-flex;align-items:center;justify-content:center;width:${size}px;height:${size}px;border-radius:50%;background:rgba(131,102,232,0.12);font-size:${Math.round(size * 0.6)}px;flex-shrink:0;">${emoji}</span>`;
}

class ReportCardManager {
  constructor() {
    this.currentPage = 1;
    this.searchQuery = '';
    this.students = [];
    this.totalStudents = 0;
    this.selectedStudentId = null;
    this.init();
  }

  init() {
    this.setupEventListeners();
    this.loadStudents();
  }

  setupEventListeners() {
    document.getElementById('studentSearch').addEventListener('input', (e) => {
      this.searchQuery = e.target.value;
      this.currentPage = 1;
      this.loadStudents();
    });

    document.getElementById('prevBtn').addEventListener('click', () => {
      if (this.currentPage > 1) {
        this.currentPage--;
        this.loadStudents();
      }
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      if (this.currentPage * 20 < this.totalStudents) {
        this.currentPage++;
        this.loadStudents();
      }
    });
  }

  async loadStudents() {
    const studentListDiv = document.getElementById('studentList');
    studentListDiv.innerHTML = '<div class="loading">Loading students...</div>';

    try {
      const params = new URLSearchParams({
        page: this.currentPage,
        q: this.searchQuery,
      });

      const response = await fetch(`/api/students?${params}`, {
        method: 'GET',
        headers: { 'Content-Type': 'application/json' }
      });

      if (!response.ok) throw new Error('Failed to load students');

      const data = await response.json();
      this.students = data.students;
      this.totalStudents = data.total;

      this.renderStudents();
      this.updatePagination(data.page, data.per_page);
    } catch (error) {
      studentListDiv.innerHTML = `<div class="error">Error loading students: ${error.message}</div>`;
    }
  }

  renderStudents() {
    const studentListDiv = document.getElementById('studentList');

    if (this.students.length === 0) {
      studentListDiv.innerHTML = '<div class="loading">No students found</div>';
      return;
    }

    studentListDiv.innerHTML = this.students.map(student => `
      <div class="student-item ${this.selectedStudentId === student.id ? 'active' : ''}" data-student-id="${student.id}">
        <div class="student-name" style="display:flex; align-items:center; gap:0.5rem;">${avatarHtml(student.avatar)}${student.name}</div>
        <div class="student-meta">${student.username || student.email || 'No username'}</div>
      </div>
    `).join('');

    document.querySelectorAll('.student-item').forEach(item => {
      item.addEventListener('click', () => {
        const studentId = parseInt(item.dataset.studentId);
        this.selectStudent(studentId);
      });
    });
  }

  selectStudent(studentId) {
    this.selectedStudentId = studentId;
    document.querySelectorAll('.student-item').forEach(item => {
      item.classList.remove('active');
    });
    document.querySelector(`[data-student-id="${studentId}"]`).classList.add('active');
    this.loadReportCard(studentId);
  }

  async loadReportCard(studentId, { refresh = false } = {}) {
    const contentDiv = document.getElementById('reportCardContent');
    contentDiv.innerHTML = `<div class="loading"><div class="loading-spinner"></div> ${
      refresh ? 'Writing a new report…' : 'Loading report…'
    }</div>`;

    try {
      // Cached server-side, so this is usually instant; ?refresh=1 forces the
      // model to write a fresh one.
      const url = `/api/students/${studentId}/report-summary${refresh ? '?refresh=1' : ''}`;
      const response = await fetch(url, {
        method: 'GET',
        headers: { 'Content-Type': 'application/json' }
      });

      if (!response.ok) {
        const error = await response.json();
        throw new Error(error.error || 'Failed to load report');
      }

      const data = await response.json();
      this.renderReportCard(data);
    } catch (error) {
      contentDiv.innerHTML = `<div class="error">Error loading report: ${error.message}</div>`;
    }
  }

  renderReportCard(data) {
    const { student_id, student_name, student_avatar, report, stats, performance_levels, generated_at } = data;
    const reading = stats.reading;
    const quiz = stats.quiz;
    const flashcard = stats.flashcard;

    const now = new Date(generated_at);
    const dateStr = now.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });

    const html = `
      <div class="report-header">
        <div style="display: flex; justify-content: space-between; align-items: start;">
          <div>
            <h1 class="student-name-large" style="display:flex; align-items:center; gap:0.6rem;">${avatarHtml(student_avatar, 36)}${student_name}</h1>
            <p class="report-date">Progress Report • ${dateStr}</p>
          </div>
          <div class="pdf-controls">
            <label class="pdf-name-field">
              <span>Name on PDF</span>
              <input type="text" id="pdfNameInput" maxlength="120" value="${student_name}"
                     title="Used only for the exported PDF — never saved to the student's record.">
            </label>
            <button id="regenerateBtn" class="btn-regenerate" title="Write a new report. The current one is reused until the student's work changes.">
              <svg class="rpt-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"></path><polyline points="21 3 21 9 15 9"></polyline></svg>
              <span class="regenerate-label">Rewrite</span>
            </button>
            <button id="downloadPdfBtn" class="btn-pdf">
              <svg class="rpt-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg><span class="pdf-btn-label">Download PDF</span>
            </button>
          </div>
        </div>
      </div>

      <div class="summary-section">
        <div class="summary-title"><svg class="rpt-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg> Overall Summary</div>
        <p class="summary-text">${report.overall_summary}</p>
      </div>

      <!-- Performance Overview -->
      <div class="performance-grid">
        <div class="performance-card ${performance_levels.reading.color}">
          <div class="performance-label"><svg class="rpt-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg> Reading</div>
          <div class="performance-value ${performance_levels.reading.color}">${reading.completion_rate.toFixed(0)}%</div>
          <div class="performance-status">${performance_levels.reading.level}</div>
          <div class="performance-status">${reading.pages_completed}/${reading.pages_started} pages</div>
        </div>
        <div class="performance-card ${performance_levels.quiz.color}">
          <div class="performance-label"><svg class="rpt-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg> Quizzes</div>
          <div class="performance-value ${performance_levels.quiz.color}">${quiz.accuracy.toFixed(0)}%</div>
          <div class="performance-status">${performance_levels.quiz.level}</div>
          <div class="performance-status">${quiz.correct}/${quiz.total} correct</div>
        </div>
        <div class="performance-card ${performance_levels.vocabulary.color}">
          <div class="performance-label"><svg class="rpt-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="6"></circle><polyline points="8.2 13.9 7 22 12 19 17 22 15.8 13.9"></polyline></svg> Vocabulary</div>
          <div class="performance-value ${performance_levels.vocabulary.color}">${flashcard.accuracy.toFixed(0)}%</div>
          <div class="performance-status">${performance_levels.vocabulary.level}</div>
          <div class="performance-status">${flashcard.mastered} cards mastered</div>
        </div>
      </div>

      <!-- What Went Well -->
      ${report.what_went_well ? `
      <div class="report-section">
        <h2 class="section-header"><svg class="rpt-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>What Went Well</h2>
        <div class="went-well-box">
          <p class="info-text">${report.what_went_well}</p>
        </div>
      </div>
      ` : ''}

      <!-- What You're Learning -->
      ${report.what_youre_learning ? `
      <div class="report-section">
        <h2 class="section-header"><svg class="rpt-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>What You're Learning</h2>
        <div class="info-box">
          <p class="info-text">${report.what_youre_learning}</p>
        </div>
      </div>
      ` : ''}

      <!-- Your Learning Patterns -->
      ${report.feedback_patterns ? `
      <div class="report-section">
        <h2 class="section-header"><svg class="rpt-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.7" y2="16.7"></line></svg>Your Learning Patterns</h2>
        <div class="info-box">
          <p class="info-text">${report.feedback_patterns}</p>
        </div>
      </div>
      ` : ''}

      <!-- Your Strengths -->
      <div class="report-section">
        <h2 class="section-header"><svg class="rpt-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>Your Strengths</h2>
        <ul class="achievement-list">
          ${report.your_strengths ? report.your_strengths.map(strength => `<li class="achievement-item"><svg class="rpt-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg><span>${strength}</span></li>`).join('') : ''}
        </ul>
      </div>

      <!-- Where to Focus -->
      <div class="report-section">
        <h2 class="section-header"><svg class="rpt-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>Where to Focus</h2>
        <ul class="growth-list">
          ${report.where_to_focus ? report.where_to_focus.map(area => `<li class="growth-item"><svg class="rpt-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg><span>${area}</span></li>`).join('') : ''}
        </ul>
      </div>

      <!-- Your Action Plan -->
      <div class="report-section">
        <h2 class="section-header"><svg class="rpt-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 18 9 18 9 13 15 13 15 8 21 8"></polyline><line x1="21" y1="8" x2="21" y2="4"></line></svg>Your Action Plan</h2>
        <ol class="action-list">
          ${report.your_action_plan ? report.your_action_plan.map((action, idx) => `
            <li class="action-item">
              <span class="action-number">${idx + 1}</span>${action}
            </li>
          `).join('') : ''}
        </ol>
      </div>

      <!-- Next Steps -->
      <div class="teacher-note">
        <div class="teacher-note-label"><svg class="rpt-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg> Your Next Steps</div>
        <p class="teacher-note-text">${report.next_steps}</p>
      </div>
    `;

    document.getElementById('reportCardContent').innerHTML = html;

    // The PDF build starts as soon as the report is on screen rather than on
    // click, so the file is usually already in hand by the time the teacher
    // reaches for the button. Editing the name discards that build and starts
    // a fresh one once typing settles.
    const regenBtn = document.getElementById('regenerateBtn');
    if (regenBtn) {
      regenBtn.addEventListener('click', () => {
        regenBtn.disabled = true;
        this.loadReportCard(student_id, { refresh: true });
      });
    }

    const pdfBtn = document.getElementById('downloadPdfBtn');
    const nameInput = document.getElementById('pdfNameInput');
    if (pdfBtn) {
      this._pdf = { studentId: student_id, defaultName: student_name,
                    pending: null, key: null, debounce: null, ticker: null };
      pdfBtn.addEventListener('click', () => this.downloadReportPDF());
      if (nameInput) {
        nameInput.addEventListener('input', () => {
          this._pdf.pending = null;   // whatever was built no longer matches the name
          clearTimeout(this._pdf.debounce);
          this._pdf.debounce = setTimeout(() => this.startPdfBuild(this.currentPdfKey()), 700);
        });
      }
      this.startPdfBuild('');
    }
  }

  // '' means "the roster name" — the request then carries no ?name at all.
  currentPdfKey() {
    const input = document.getElementById('pdfNameInput');
    const name = input ? input.value.trim() : '';
    return (!name || name === this._pdf.defaultName) ? '' : name;
  }

  startPdfBuild(key) {
    const base = `/api/students/${this._pdf.studentId}/report-summary/pdf`;
    const url = key ? `${base}?name=${encodeURIComponent(key)}` : base;
    this._pdf.key = key;
    this._pdf.pending = fetch(url).then(async (res) => {
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.error || `Failed to generate PDF (${res.status})`);
      }
      // Filename comes from the response header, not blob.name — that property
      // does not exist, so the old code always fell back to report_<id>.pdf.
      const match = (res.headers.get('Content-Disposition') || '').match(/filename="?([^"]+)"?/);
      return { blob: await res.blob(), filename: match ? match[1] : `report_${this._pdf.studentId}.pdf` };
    });
    this._pdf.pending.catch(() => {});   // a background failure surfaces on click, not as noise
    return this._pdf.pending;
  }

  setPdfBusy(busy) {
    const btn = document.getElementById('downloadPdfBtn');
    const label = btn.querySelector('.pdf-btn-label');
    btn.disabled = busy;
    clearInterval(this._pdf.ticker);
    if (!busy) {
      label.textContent = 'Download PDF';
      return;
    }
    // Only show a running count once the wait is long enough to notice.
    const started = Date.now();
    label.textContent = 'Preparing…';
    this._pdf.ticker = setInterval(() => {
      const secs = (Date.now() - started) / 1000;
      if (secs > 1.5) label.textContent = `Preparing… ${secs.toFixed(0)}s`;
    }, 250);
  }

  async downloadReportPDF() {
    const key = this.currentPdfKey();
    this.setPdfBusy(true);
    try {
      if (!this._pdf.pending || this._pdf.key !== key) this.startPdfBuild(key);
      const { blob, filename } = await this._pdf.pending;
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      window.URL.revokeObjectURL(url);
      document.body.removeChild(a);
    } catch (error) {
      this._pdf.pending = null;   // don't cache a failure
      alert(`Error downloading PDF: ${error.message}`);
    } finally {
      this.setPdfBusy(false);
    }
  }

  updatePagination(page, perPage) {
    const totalPages = Math.ceil(this.totalStudents / perPage);
    document.getElementById('pageInfo').textContent = `Page ${page} of ${totalPages}`;
    document.getElementById('prevBtn').disabled = page === 1;
    document.getElementById('nextBtn').disabled = page >= totalPages;
  }
}

document.addEventListener('DOMContentLoaded', () => {
  new ReportCardManager();
});
</script>
