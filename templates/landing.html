<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .landing-body { background: var(--bg-light); color: var(--text-dark); margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .landing-card { max-width: 480px; width: 100%; padding: 3rem 2.5rem; text-align: center; background: var(--bg-white); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-lg); }
        .landing-card h1 { font-size: 2.2rem; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 0.75rem; }
        .landing-card h1 .brand { background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .landing-card p { color: var(--text-light); font-size: 1.05rem; margin: 0 0 2rem; }
        .landing-actions { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
        .landing-btn { padding: 0.7rem 1.6rem; border-radius: 8px; font-weight: 600; text-decoration: none; font-size: 0.95rem; transition: all 0.2s; }
        .landing-btn-primary { background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary-dark) 100%); color: #fff; }
        .landing-btn-primary:hover { box-shadow: 0 6px 20px rgba(131, 102, 232, 0.4); transform: translateY(-2px); }
        .landing-btn-secondary { background: var(--bg-white); color: var(--text-dark); border: 1px solid var(--border); }
        .landing-btn-secondary:hover { border-color: var(--primary); color: var(--primary); transform: translateY(-2px); }
        .landing-theme-toggle {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            background: transparent;
            border: 1px solid var(--border);
            cursor: pointer;
            padding: 0.5rem 0.65rem;
            border-radius: 6px;
            transition: all 0.2s ease;
            font-size: 1rem;
            color: var(--text-dark);
        }
        .landing-theme-toggle:hover {
            background: rgba(157, 132, 255, 0.12);
            border-color: var(--primary);
            color: var(--primary);
        }
    </style>
    {% include '_pwa_head.html' %}
</head>
<body class="landing-body">
    <button id="themeToggle" class="landing-theme-toggle" title="Toggle dark mode">🌙</button>
    <div class="landing-card">
        <h1>📚 <span class="brand">The Oracle</span></h1>
        <p>Assigned readings, tracked progress, and a class dashboard for your teacher.</p>
        <div class="landing-actions">
            <a href="{{ url_for('auth.login') }}" class="landing-btn landing-btn-primary">Log In</a>
            <a href="{{ url_for('auth.signup') }}" class="landing-btn landing-btn-secondary">Sign Up</a>
        </div>
    </div>
    <script>
        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.dataset.theme = savedTheme;
            updateThemeToggle();
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.dataset.theme || 'light';
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.dataset.theme = newTheme;
            localStorage.setItem('theme', newTheme);
            updateThemeToggle();
        }

        function updateThemeToggle() {
            const toggleBtn = document.getElementById('themeToggle');
            const isDark = document.documentElement.dataset.theme === 'dark';
            toggleBtn.textContent = isDark ? '☀️' : '🌙';
        }

        document.getElementById('themeToggle').addEventListener('click', toggleTheme);
        document.addEventListener('DOMContentLoaded', initTheme);
        initTheme();
    </script>
</body>
</html>
