        }

        function setupReadingModeScrollListener() {
            const mainArea = document.querySelector('.reader-main-area');
            if (mainArea) {
                mainArea.addEventListener('scroll', updateReadingModeHeader);
            }
        }

        let lastVisiblePageId = null;

        function updateReadingModeHeader() {
            if (!document.body.classList.contains('reading-mode')) return;

            const sections = document.querySelectorAll('.reading-section');
            const pageTitle = document.getElementById('pageTitle');
            const mainArea = document.querySelector('.reader-main-area');

            if (!pageTitle || !mainArea || sections.length === 0) return;

            let currentSection = sections[0];
            let maxVisibility = 0;

            sections.forEach(section => {
                const rect = section.getBoundingClientRect();
                const visible = Math.max(0, Math.min(rect.bottom, mainArea.clientHeight) - Math.max(rect.top, 0));

                if (visible > maxVisibility) {
                    maxVisibility = visible;
                    currentSection = section;
                }
            });

            const title = currentSection.getAttribute('data-page-title');
            const pageId = currentSection.getAttribute('data-page-id');
            if (title) {
                pageTitle.textContent = title;
            }

            if (pageId && pageId !== lastVisiblePageId) {
                lastVisiblePageId = pageId;
                if (window.__sectionChanged) {
                    window.__sectionChanged(pageId);
                }
            }
        }

        // Returns the page id of the reading-mode section currently most in view,
        // so that exiting reading mode can land on the page the user is actually on.
        function getCurrentReadingPageId() {
            const sections = document.querySelectorAll('.reading-section');
            const mainArea = document.querySelector('.reader-main-area');
            if (!mainArea || sections.length === 0) return null;

            let currentSection = sections[0];
            let maxVisibility = 0;

            sections.forEach(section => {
                const rect = section.getBoundingClientRect();
                const visible = Math.max(0, Math.min(rect.bottom, mainArea.clientHeight) - Math.max(rect.top, 0));
                if (visible > maxVisibility) {
                    maxVisibility = visible;
                    currentSection = section;
                }
            });

            return currentSection.getAttribute('data-page-id');
        }

        /* ── Confidence scale ──────────────────────────────────────────────
           Five drawn faces on one shared 24px grid: same head, same eyes, only
           the mouth path changes, so the row reads as one scale rather than five
           unrelated icons. The words are the accessible name for each step and
           the readout text, so the meaning never lives in the picture alone. */
        const CONFIDENCE_STEPS = [
            { level: 1, label: 'Not confident at all', mouth: 'M8.5 16.2Q12 13 15.5 16.2' },
            { level: 2, label: 'Somewhat unsure',      mouth: 'M8.5 15.6Q12 14.1 15.5 15.6' },
            { level: 3, label: 'Neutral',              mouth: 'M9 15.3h6' },
            { level: 4, label: 'Fairly confident',     mouth: 'M8.5 14.4Q12 16.4 15.5 14.4' },
            { level: 5, label: 'Very confident',       mouth: 'M8 14Q12 17.4 16 14' },
        ];

        function confidenceFaceSVG(mouth) {
            return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="9"/>
                        <circle cx="9" cy="10" r="0.9" fill="currentColor" stroke="none"/>
                        <circle cx="15" cy="10" r="0.9" fill="currentColor" stroke="none"/>
                        <path d="${mouth}"/>
                    </svg>`;
        }

        function buildConfidenceScale() {
            const widget = document.getElementById('confidenceWidget');
            if (!widget || widget.childElementCount) return;
            widget.innerHTML = CONFIDENCE_STEPS.map(s => `
                <button type="button" class="confidence-btn" role="radio" aria-checked="false"
                        tabindex="-1" data-level="${s.level}" aria-label="${s.label}">
                    ${confidenceFaceSVG(s.mouth)}
                </button>`).join('');
            /* Until something is chosen the group still needs one reachable stop,
               otherwise the whole scale is skipped by the keyboard. */
            const first = widget.querySelector('.confidence-btn');
            if (first) first.tabIndex = 0;
            widget.addEventListener('keydown', confidenceKeys);
        }

        /* Roving tabindex: one stop for the group, arrows move and select. */
        function confidenceKeys(e) {
            const keys = { ArrowLeft: -1, ArrowUp: -1, ArrowRight: 1, ArrowDown: 1 };
            const step = keys[e.key];
            if (!step) return;
            const btns = [...document.querySelectorAll('#confidenceWidget .confidence-btn')];
            const at = btns.indexOf(document.activeElement);
            if (at === -1) return;
            e.preventDefault();
            const next = btns[(at + step + btns.length) % btns.length];
            next.focus();
            next.click();
        }

        function markConfidenceSelected(level) {
            const btns = document.querySelectorAll('#confidenceWidget .confidence-btn');
            btns.forEach(b => {
                const on = Number(b.dataset.level) === Number(level);
                b.classList.toggle('active', on);
                b.setAttribute('aria-checked', on ? 'true' : 'false');
                b.tabIndex = on ? 0 : -1;
            });
            if (!level && btns.length) btns[0].tabIndex = 0;
        }

        function setConfidenceReadout(text, isError) {
            const out = document.getElementById('confidenceReadout');
            if (!out) return;
            out.textContent = text || '';
            out.classList.toggle('is-error', !!isError);
        }

        async function loadConfidenceRating() {
            try {
                const response = await fetch(`/api/confidence?book_folder=${bookFolder}&page_id=${pageId}`);
                const data = await response.json();
                const level = data.confidence_level;
                if (level) {
                    markConfidenceSelected(level);
                    const step = CONFIDENCE_STEPS.find(s => s.level === Number(level));
                    if (step) setConfidenceReadout(step.label);
                }
            } catch (error) {
                console.error('Failed to load confidence rating:', error);
            }
        }

        async function saveConfidenceRating(level) {
            const step = CONFIDENCE_STEPS.find(s => s.level === Number(level));
            try {
                const response = await fetch('/api/confidence', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ book_folder: bookFolder, page_id: pageId, confidence_level: level })
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                /* Previously a failed save only reached console.error, so the button
                   stayed lit and the student believed a rating had been recorded that
                   never was. Success and failure both say so now. */
                setConfidenceReadout(step ? step.label : '');
            } catch (error) {
                console.error('Error saving confidence rating:', error);
                setConfidenceReadout('Not saved — try again', true);
            }
        }

        function togglePageComplete(pid, btn) {
            const isCompleted = btn.classList.contains('complete');
            const newState = !isCompleted;

            /* The inline background that used to be set here beat the .complete /
               .incomplete rules for the rest of the page's life, so the button's
               hover states stopped working after the first toggle. The classes own
               the colour now. */
            btn.classList.toggle('complete', newState);
            btn.classList.toggle('incomplete', !newState);
            btn.innerHTML = completeBtnContent(newState);
            btn.setAttribute('aria-pressed', newState ? 'true' : 'false');

            // If this is the current page, update the main complete button too
            if (pid === pageId) {
                pageCompleted = newState;
                updateCompleteButton();
            }

            // Report completion
            if (window.__reportComplete) {
                window.__reportComplete(newState, pid);
            }
        }

        function savePageConfidenceRating(pid, level, btn) {
            // Update button state
            /* Same inline-style problem as the complete button: these three inline
               declarations outranked .confidence-btn.active permanently, so once a
               rating had been clicked the hover and focus styles never applied
               again. The .active class carries all of it. */
            const confidenceWidget = btn.parentElement;
            confidenceWidget.querySelectorAll('.confidence-btn').forEach(b => {
                const on = b === btn;
                b.classList.toggle('active', on);
                b.setAttribute('aria-checked', on ? 'true' : 'false');
                b.tabIndex = on ? 0 : -1;
            });

            // Save confidence for this page
            if (pid === pageId) {
                saveConfidenceRating(level);
            } else {
                fetch('/api/confidence', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ book_folder: bookFolder, page_id: pid, confidence_level: level })
                }).catch(err => console.error('Failed to save confidence:', err));
            }
        }

        // Converts plain text containing "- " bullet lines and blank-line-separated
        // paragraphs into real HTML (<ul><li>/<p>). Leaves already-rich HTML (from the
        // editor's toolbar) untouched, since that already contains real tags.
        function textBlockToHtml(text) {
            if (!text) return '';
            if (text.includes('<')) return text;

            const chunks = text.split(/\n\n+/);
            const htmlChunks = chunks.map(chunk => {
                const lines = chunk.split('\n');
                const bulletCount = lines.filter(l => l.trim().startsWith('- ')).length;
                if (bulletCount > 0 && bulletCount >= lines.length - 1) {
                    let out = '';
                    let items = '';
                    lines.forEach(line => {
                        const t = line.trim();
                        if (t.startsWith('- ')) {
                            items += `<li>${t.slice(2)}</li>`;
                        } else if (t) {
                            out += `<p style="margin:0 0 0.5rem; font-weight:600;">${t}</p>`;
                        }
                    });
                    return out + (items ? `<ul style="margin:0 0 1rem 1.25rem; padding:0;">${items}</ul>` : '');
                }
                return `<p style="margin:0 0 1rem;">${lines.join('<br>')}</p>`;
            });

            return htmlChunks.join('')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/__(.*?)__/g, '<em>$1</em>');
        }

        // ── Admin: export the whole page (main + side content) as plain text ──
        function htmlToText(html) {
            if (html == null) return '';
            let s = String(html);
            if (!s.includes('<')) return s;
            s = s.replace(/<\s*br\s*\/?>/gi, '\n')
                 .replace(/<li[^>]*>/gi, '- ')
                 .replace(/<\/(p|div|li|h[1-6]|tr)>/gi, '\n');
            const tmp = document.createElement('div');
            tmp.innerHTML = s;
            const text = tmp.textContent || tmp.innerText || '';
            return text.replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
        }

        function exportPageText() {
            if (!currentPageData || !Array.isArray(currentPageData.blocks)) {
                alert('Page content is still loading — try again in a moment.');
                return;
            }
            const blocks = currentPageData.blocks;
            const title = currentPageData.title || currentPageData.main_heading || pageId || 'page';
            const body = [title, '='.repeat(Math.min(title.length, 80)), ''];
            const side = [];

            blocks.forEach(b => {
                switch (b.type) {
                    case 'heading': {
                        const lvl = b.level || 2;
                        const indent = lvl > 2 ? '  '.repeat(lvl - 2) : '';
                        body.push('', indent + htmlToText(b.text), '');
                        break;
                    }
                    case 'text':
                        body.push(htmlToText(b.text), '');
                        break;
                    case 'guiding':
                        body.push((b.title || 'Guiding Questions') + ':');
                        guidingQuestionsToItems(b.text).forEach(q => body.push('  - ' + htmlToText(q)));
                        body.push('');
                        break;
                    case 'question':
                        body.push('Q: ' + htmlToText(b.text));
                        if (b.answer) body.push('A: ' + htmlToText(b.answer));
                        body.push('');
                        break;
                    case 'sidebox':
                        side.push('[' + (b.title || 'Note') + ']', htmlToText(b.text), '');
                        break;
                    case 'image':
                        if (b.alt) (b.side ? side : body).push('[Image: ' + b.alt + ']');
                        break;
                    case 'video':
                        if (b.title) (b.side ? side : body).push('[Video: ' + b.title + ']');
                        break;
                }
            });

            if (side.length) body.push('', '--- SIDE CONTENT ---', '', ...side);

            const content = body.join('\n').replace(/\n{3,}/g, '\n\n').trim() + '\n';
            const base = (currentPageData.topic_number || title || 'page')
                .toString().replace(/[^\w.-]+/g, '_').replace(/^_+|_+$/g, '') || 'page';
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = base + '.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        }

        // Guiding-questions block: one question per line. Strip any leading
        // numbering/bullet the author typed (the component numbers them itself).
        function guidingQuestionsToItems(text) {
            return (text || '')
                .split('\n')
                .map(line => line.replace(/^\s*(?:\d+[.)]\s*|[-*•]\s*)/, '').trim())
                .filter(Boolean);
        }

        // Light inline formatting for a single question (bold/italic), HTML-safe.
        function guidingInline(q) {
            if (q.includes('<')) return q;
            return escapeHtml(q)
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/__(.*?)__/g, '<em>$1</em>');
        }

        function buildGuidingPanelHTML(block) {
            const items = guidingQuestionsToItems(block.text);
            const lis = items.length
                ? items.map(q => `<li>${guidingInline(q)}</li>`).join('')
                : '<li>Add guiding questions, one per line.</li>';
            return `
                <div class="guiding-panel__header">
                    <span class="guiding-panel__icon" aria-hidden="true">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
                    </span>
                    <h3 class="guiding-panel__title">${escapeHtml(block.title || 'Guiding Questions')}</h3>
                    <span class="guiding-panel__subtitle">Reflect as you read</span>
                </div>
                <div class="guiding-panel__body">
                    <ul class="guiding-list">${lis}</ul>
                </div>`;
        }

        // The title is shown once, in the sticky bar. The topic number is split
        // off so it can carry the accent without repeating itself in the title.
        function setPageTitlebar(data) {
            const topic = String(data.topic_number || '').trim();
            let title = String(data.title || '').trim();
            if (topic && title.toLowerCase().startsWith(topic.toLowerCase())) {
                title = title.slice(topic.length).replace(/^[\s.:–—-]+/, '');
            }
            const topicEl = document.getElementById('pageTopicNo');
            const titleEl = document.getElementById('pageTitleMain');
            if (topicEl) {
                topicEl.textContent = topic;
                topicEl.style.display = topic ? '' : 'none';
            }
            if (titleEl) titleEl.textContent = title || data.title || '';
            setupTitlebarScroll();
        }

        // The bar morphs from a large stacked heading into a compact one-line bar
        // over the first COLLAPSE_PX of scroll. Everything is driven off a single
        // --p custom property so the whole transition is one CSS interpolation.
        const COLLAPSE_PX = 160;

        function setupTitlebarScroll() {
            const area = document.querySelector('.reader-main-area');
            const bar = document.getElementById('pageTitlebar');
            const inner = bar && bar.querySelector('.page-titlebar-inner');
            const titleEl = document.getElementById('pageTitleMain');
            const chipEl = document.getElementById('pageTopicNo');
            if (!area || !bar || !inner || !titleEl) return;

            // Largest and smallest the expanded title may become, whatever the fit says.
            const TITLE_MAX_PX = 54;
            const TITLE_MIN_PX = 20;
            const PROBE_PX = 100;

            // Canvas measurement rather than a DOM probe: it gives the text's natural
            // width without forcing a layout pass or briefly painting a wrong size.
            const gauge = document.createElement('canvas').getContext('2d');

            // Solve for the biggest font-size whose title still fits on one line beside
            // the chip. Text width scales linearly with font-size, so one measurement at
            // a probe size gives the answer directly — no binary search needed.
            const fitTitle = () => {
                const text = titleEl.textContent.trim();
                if (!text) return;
                const cs = getComputedStyle(titleEl);
                const innerCs = getComputedStyle(inner);
                gauge.font = `${cs.fontStyle} ${cs.fontWeight} ${PROBE_PX}px ${cs.fontFamily}`;
                const probeWidth = gauge.measureText(text).width;
                if (!probeWidth) return;

                const avail = inner.clientWidth
                    - parseFloat(innerCs.paddingLeft)
                    - parseFloat(innerCs.paddingRight)
                    - (chipEl ? chipEl.offsetWidth : 0)
                    - parseFloat(innerCs.columnGap || 0);

                // 0.98 leaves a hair of slack: canvas ignores letter-spacing, which is
                // negative here, so this errs toward fitting rather than clipping.
                const fitted = (avail * 0.98) / probeWidth * PROBE_PX;
                const size = Math.max(TITLE_MIN_PX, Math.min(TITLE_MAX_PX, fitted));
                bar.style.setProperty('--title-lg', size.toFixed(2) + 'px');
            };

            // Measure both endpoints so the reserved slot matches the expanded bar
            // exactly. Re-run whenever the title text or the width changes, since a
            // long title wraps to two lines and makes the expanded state taller.
            const measure = () => {
                const prevP = bar.style.getPropertyValue('--p');
                const wasStuck = bar.classList.contains('is-stuck');
                const wasCondensed = bar.classList.contains('is-condensed');
                bar.style.removeProperty('--bar-lg');

                // Each endpoint must be measured with its own typeface, or the
                // reserved height is computed against the wrong metrics.
                bar.style.setProperty('--p', '0');
                bar.classList.remove('is-stuck', 'is-condensed');
                // Fit first: the expanded height depends on the size we solve for.
                fitTitle();
                const lg = inner.offsetHeight;

                bar.style.setProperty('--p', '1');
                bar.classList.add('is-stuck', 'is-condensed');
                const sm = inner.offsetHeight;

                bar.style.setProperty('--bar-lg', lg + 'px');
                bar.style.setProperty('--bar-sm', sm + 'px');
                if (prevP) bar.style.setProperty('--p', prevP);
                bar.classList.toggle('is-stuck', wasStuck);
                bar.classList.toggle('is-condensed', wasCondensed);
            };

            measure();
            if (area.dataset.titlebarBound) {
                // Re-bound after a title change: only the measurement needed refreshing.
                area.dispatchEvent(new Event('scroll'));
                return;
            }
            area.dataset.titlebarBound = '1';
            // Belt and braces: stop the scroller from nudging scrollTop on its own.
            area.style.overflowAnchor = 'none';
            window.addEventListener('resize', measure);
            // The sidebar resizes the grid column without firing a window resize, so
            // the fit has to be recomputed from the element's own width changes.
            if (window.ResizeObserver) {
                let settled = 0;
                new ResizeObserver(() => {
                    cancelAnimationFrame(settled);
                    settled = requestAnimationFrame(measure);
                }).observe(inner);
            }
            // Fraunces arrives after first paint; its metrics differ from the serif
            // fallback, so the reserved height has to be recomputed once it lands.
            if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);

            const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            let frame = 0;
            let last = -1;

            const apply = () => {
                frame = 0;
                const raw = Math.min(area.scrollTop / COLLAPSE_PX, 1);
                // Smoothstep: eases out of the expanded state and settles into the
                // compact one, instead of tracking the scrollwheel linearly.
                const eased = raw * raw * (3 - 2 * raw);
                const p = reduceMotion ? 1 : eased;
                if (Math.abs(p - last) < 0.001) return;
                last = p;
                // Written straight to the node so scrolling never triggers a re-render.
                bar.style.setProperty('--p', p.toFixed(4));
                bar.classList.toggle('is-stuck', p > 0.99);
                // Serif -> sans swap, fired mid-flip so it is masked by the movement.
                bar.classList.toggle('is-condensed', p > 0.42);
            };

            area.addEventListener('scroll', () => {
                if (!frame) frame = requestAnimationFrame(apply);
            }, { passive: true });
            apply();
        }

                                    aria-label="Close figure viewer">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                                </svg>
                            </button>
                        </header>
                        <div class="figure-stage">
                            <button type="button" class="figure-nav prev" onclick="stepFigure(-1)"
                                    aria-label="Previous figure">
                                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="15 18 9 12 15 6"/>
                                </svg>
                            </button>
                            <img data-figure-img alt="">
                            <button type="button" class="figure-nav next" onclick="stepFigure(1)"
                                    aria-label="Next figure">
                                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="9 18 15 12 9 6"/>
                                </svg>
                            </button>
                        </div>
                    </div>`;
                document.body.appendChild(dlg);
                document.addEventListener('keydown', figureKeys);
            }
            dlg.classList.add('is-open');
            document.documentElement.style.overflow = 'hidden';
            showFigure();
            const close = dlg.querySelector('.figure-close');
            if (close) close.focus();
        }

        function showFigure() {
            const dlg = document.getElementById('figureDialog');
            if (!dlg) return;
            const f = figureList[figureAt];
            const img = dlg.querySelector('[data-figure-img]');
            /* The strip tiles already hide themselves on a bad src; the dialog had no
               equivalent, so a missing figure showed a broken-image icon on the scrim.
               Name what failed instead — the caption below still carries the context. */
            img.onerror = () => {
                img.removeAttribute('src');
                img.alt = `Figure ${figureAt + 1} could not be loaded`;
            };
            img.alt = f.alt || `Figure ${figureAt + 1}`;
            img.src = f.src;
            dlg.querySelector('[data-figure-pos]').textContent =
                `Figure ${figureAt + 1} of ${figureList.length}`;
            dlg.querySelector('[data-figure-cap]').textContent = f.caption || '';
            const many = figureList.length > 1;
            dlg.querySelectorAll('.figure-nav').forEach(b => b.style.display = many ? '' : 'none');
        }

        function stepFigure(delta) {
            if (figureList.length < 2) return;
            figureAt = (figureAt + delta + figureList.length) % figureList.length;
            showFigure();
        }

        function closeFigureDialog() {
            const dlg = document.getElementById('figureDialog');
            if (!dlg) return;
            dlg.classList.remove('is-open');
            document.documentElement.style.overflow = '';
            /* Hand focus back to the tile that opened it. Without this, closing
               dropped focus on <body> and a keyboard reader restarted their tab
               order from the top of the page every time they viewed a figure. */
            if (figureOpener && document.contains(figureOpener)) figureOpener.focus();
            figureOpener = null;
        }

        function figureKeys(e) {
            const dlg = document.getElementById('figureDialog');
            if (!dlg || !dlg.classList.contains('is-open')) return;
            if (e.key === 'Escape') { e.preventDefault(); closeFigureDialog(); }
            else if (e.key === 'ArrowRight') { e.preventDefault(); stepFigure(1); }
            else if (e.key === 'ArrowLeft') { e.preventDefault(); stepFigure(-1); }
        }

        /* ── Vocabulary editing ────────────────────────────────────────────
           Vocabulary is canonical in sidebar_sections: the API re-injects it as
           a vocab sidebox on read and folds it back on save, so editing the
           block's text is enough to persist it. In edit mode it appears in the
           same full-width panel students see, but as term/definition rows, so
           terms can be added and removed without hand-writing <strong> tags. */

        function vocabItemsFromText(text) {
            const items = [];
            String(text || '').split(/<br\s*\/?>/i).forEach(chunk => {
                const raw = chunk.trim();
                if (!raw) return;
                const m = raw.match(/^<strong>(.*?)<\/strong>\s*:?\s*([\s\S]*)$/i);
                if (m) items.push({ term: m[1].trim(), def: m[2].trim() });
                else items.push({ term: '', def: raw });   // keep anything odd rather than lose it
            });
            return items;
        }

        function vocabRowHTML(item) {
            return `
                <div class="vocab-edit-row">
                    <div class="vocab-edit-term" contenteditable="true" data-vterm
                         data-placeholder="Term">${item.term || ''}</div>
                    <div class="vocab-edit-def" contenteditable="true" data-vdef
                         data-placeholder="Definition">${item.def || ''}</div>
                    <button type="button" class="vocab-edit-del" title="Remove this term"
                            onclick="removeVocabTerm(this)">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <polyline points="3 6 5 6 21 6"/>
                            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                            <path d="M10 11v6M14 11v6"/>
                        </svg>
                    </button>
                </div>`;
        }

        function renderVocabEditor(vocabIndex) {
            const host = document.getElementById('pageVocab');
            if (!host) return;

            // No vocabulary on this page yet — offer to start one.
            if (vocabIndex < 0) {
                host.innerHTML = `
                    <section class="vocab-panel vocab-editing">
                        <h3>${sideboxIcon('vocab')}<span>Vocabulary</span></h3>
                        <p class="vocab-empty">This page has no vocabulary yet.</p>
                        <button type="button" class="vocab-add-btn" onclick="addVocabBlock()">
                            + Add vocabulary
                        </button>
                    </section>`;
                return;
            }

            const block = currentPageData.blocks[vocabIndex];
            const items = vocabItemsFromText(block.text);
            host.innerHTML = `
                <section class="vocab-panel vocab-editing" data-vocab-editor
                         data-block-index="${vocabIndex}">
                    <h3>${sideboxIcon('vocab')}<span>Vocabulary</span>
                        <span class="vocab-count" data-vocab-count></span>
                    </h3>
                    <div class="vocab-edit-list" data-vocab-list>
                        ${items.map(vocabRowHTML).join('')}
                    </div>
                    <button type="button" class="vocab-add-btn" onclick="addVocabTerm(this)">
                        + Add term
                    </button>
                </section>`;
            updateVocabCount();
        }

        // Vocabulary has no .block-container in edit mode (it renders as the
        // term/definition panel instead), so it needs its own way in rather
        // than editBlock's scroll-to-container.
        function editVocabulary() {
            enterPageEditMode();
            const editor = document.querySelector('[data-vocab-editor]');
            if (!editor) return;
            editor.scrollIntoView({ behavior: 'smooth', block: 'center' });
            const first = editor.querySelector('[data-vterm]');
            if (first) first.focus();
        }

        function updateVocabCount() {
            const ed = document.querySelector('[data-vocab-editor]');
            if (!ed) return;
            const n = ed.querySelectorAll('.vocab-edit-row').length;
            const label = ed.querySelector('[data-vocab-count]');
            if (label) label.textContent = `${n} term${n === 1 ? '' : 's'}`;
        }

        function addVocabTerm(btn) {
            const list = btn.parentElement.querySelector('[data-vocab-list]');
            if (!list) return;
            list.insertAdjacentHTML('beforeend', vocabRowHTML({ term: '', def: '' }));
            updateVocabCount();
            const row = list.lastElementChild;
            const term = row && row.querySelector('[data-vterm]');
            if (term) term.focus();
        }

        function removeVocabTerm(btn) {
            const row = btn.closest('.vocab-edit-row');
            if (row) row.remove();
            updateVocabCount();
        }

        function addVocabBlock() {
            if (!currentPageData.blocks) currentPageData.blocks = [];
            currentPageData.blocks.push({
                type: 'sidebox', style: 'vocab', title: 'Vocabulary', text: ''
            });
            renderEditableContent();
            const btn = document.querySelector('[data-vocab-editor] .vocab-add-btn');
            if (btn) addVocabTerm(btn);
        }

        // Fold the rows back into the block's text in the canonical
        // "<strong>Term</strong>: definition<br>…" shape the reader and the
        // save endpoint both expect.
        function collectVocabEdits() {
            const ed = document.querySelector('[data-vocab-editor]');
            if (!ed) return;
            const i = parseInt(ed.getAttribute('data-block-index'), 10);
            const block = currentPageData.blocks && currentPageData.blocks[i];
            if (!block) return;

            const parts = [];
            ed.querySelectorAll('.vocab-edit-row').forEach(row => {
                const term = (row.querySelector('[data-vterm]').textContent || '').trim();
                const def = (row.querySelector('[data-vdef]').innerHTML || '').trim();
                if (!term && !def) return;
                parts.push(term ? `<strong>${escapeHtml(term)}</strong>: ${def}` : def);
            });
            block.text = parts.join('<br>');
        }

        // Vocabulary renders full width below the content as a definition grid.
        // The source text is "<strong>Term</strong>: definition<br>…"; anything
        // that doesn't match that shape is shown as-is rather than dropped.
        function renderVocabulary(entries) {
            const host = document.getElementById('pageVocab');
            if (!host) return;
            host.innerHTML = '';

            // Admins get an "add vocabulary" prompt on pages that have none,
            // so a missing section is still reachable from read mode.
            if (!entries || !entries.length) {
                if (window.__isAdmin__) {
                    const empty = document.createElement('section');
                    empty.className = 'vocab-panel';
                    empty.innerHTML =
                        `<h3>${sideboxIcon('vocab')}<span>Vocabulary</span></h3>
                         <p class="vocab-empty">This page has no vocabulary yet.</p>
                         <button type="button" class="vocab-add-btn"
                                 onclick="enterPageEditMode()">+ Add vocabulary</button>`;
                    host.appendChild(empty);
                }
                return;
            }

            const editIndex = entries[0].index;
            const items = [];
            const loose = [];
            entries.map(e => e.block).forEach(block => {
                String(block.text || '').split(/<br\s*\/?>/i).forEach(chunk => {
                    const raw = chunk.trim();
                    if (!raw) return;
                    const m = raw.match(/^<strong>(.*?)<\/strong>\s*:?\s*([\s\S]*)$/i);
                    if (m && m[2].trim()) items.push({ term: m[1].trim(), def: m[2].trim() });
                    else loose.push(raw);
                });
            });
            if (!items.length && !loose.length) return;

            // block-container gives it the same relative positioning and
            // hover-to-reveal behaviour as every other editable block.
            const section = document.createElement('section');
            section.className = 'vocab-panel block-container';
            section.innerHTML = `
                <h3>${sideboxIcon('vocab')}<span>Vocabulary</span>
                    <span class="vocab-count">${items.length} term${items.length === 1 ? '' : 's'}</span>
                </h3>
                <dl class="vocab-grid">
                    ${items.map(i => `
                        <div class="vocab-item">
                            <dt>${i.term}</dt>
                            <dd>${i.def}</dd>
                        </div>`).join('')}
                </dl>
                ${loose.length ? `<div class="vocab-loose">${loose.join('<br>')}</div>` : ''}
            `;

            if (window.__isAdmin__) {
                const editBtn = document.createElement('button');
                editBtn.className = 'block-edit-btn';
                editBtn.type = 'button';
                editBtn.title = 'Edit vocabulary';
                editBtn.innerHTML =
                    `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 20h9"/>
                        <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
                     </svg>`;
                editBtn.onclick = () => editVocabulary();
                section.appendChild(editBtn);
            }

            host.appendChild(section);
        }

        // Some topics have an interactive "run it" module that mounts full width
        // below the content (see static/js/dynamic-page.js). Topics without one
        // are left exactly as they are — nothing is downloaded, nothing renders.
        function mountDynamicModule(data) {
            const body = document.getElementById('pageDynamic');
            if (body) body.innerHTML = '';
            if (!window.DynamicPage || !data || !body) return;
            let topic = (data.topic_number || '').trim();
            if (!topic) {
                const m = (data.title || '').match(/^([A-Z]\d+(?:\.\d+)+)/);
                topic = m ? m[1] : '';
            }
            if (topic && DynamicPage.has(topic)) DynamicPage.mount(body, topic);
        }

        function getYouTubeId(url) {
            if (!url) return null;
            const patterns = [
                /(?:youtube\.com\/embed\/|youtube\.com\/watch\?v=|youtu\.be\/)([\w-]+)/,
                /(?:youtube-nocookie\.com\/embed\/)([\w-]+)/,
                /(?:youtube\.com\/shorts\/)([\w-]+)/,
            ];
            for (let pattern of patterns) {
                const m = url.match(pattern);
                if (m) return m[1];
            }
            return null;
        }

        function openCodeFullscreen(code, language, title) {
            // Create modal overlay
            const modal = document.createElement('div');
            modal.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0, 0, 0, 0.8);
                display: flex;
                flex-direction: column;
                z-index: 10000;

            `;

            // Create header with controls
            const header = document.createElement('div');
            header.style.cssText = `
                background: #2d2d30;
                padding: 1rem;
                display: flex;
                justify-content: space-between;
                align-items: center;
                border-bottom: 1px solid #3e3e42;
            `;

            const titleEl = document.createElement('div');
            titleEl.style.cssText = 'color: #d4d4d4; font-size: 1.1rem; font-weight: 600;';
            titleEl.textContent = title || 'Code';
            header.appendChild(titleEl);

            // Controls container
            const controls = document.createElement('div');
            controls.style.cssText = 'display: flex; gap: 1rem; align-items: center;';

            // Zoom controls
            const zoomLabel = document.createElement('span');
            zoomLabel.textContent = 'Zoom:';
            zoomLabel.style.cssText = 'color: #d4d4d4;';
            controls.appendChild(zoomLabel);

            const zoomOut = document.createElement('button');
            zoomOut.textContent = '−';
            zoomOut.style.cssText = `
                background: #3e3e42;
                border: 1px solid #555;
                color: #d4d4d4;
                padding: 0.4rem 0.8rem;
                cursor: pointer;
                border-radius: 4px;
            `;
            controls.appendChild(zoomOut);

            const zoomLevel = document.createElement('span');
            zoomLevel.textContent = '100%';
            zoomLevel.style.cssText = 'color: #d4d4d4; min-width: 50px; text-align: center;';
            controls.appendChild(zoomLevel);

            const zoomIn = document.createElement('button');
            zoomIn.textContent = '+';
            zoomIn.style.cssText = `
                background: #3e3e42;
                border: 1px solid #555;
                color: #d4d4d4;
                padding: 0.4rem 0.8rem;
                cursor: pointer;
                border-radius: 4px;
            `;
            controls.appendChild(zoomIn);

            // Close button
            const closeBtn = document.createElement('button');
            closeBtn.textContent = '✕ Close';
            closeBtn.style.cssText = `
                background: #3e3e42;
                border: 1px solid #555;
                color: #d4d4d4;
                padding: 0.4rem 0.8rem;
                cursor: pointer;
                border-radius: 4px;
            `;
            controls.appendChild(closeBtn);

            header.appendChild(controls);
            modal.appendChild(header);

            // Code container
            const codeContainer = document.createElement('div');
            codeContainer.style.cssText = `
                flex: 1;
                overflow: auto;
                padding: 2rem;
                background: #1e1e1e;
            `;
            codeContainer.id = 'fullscreen-code-container-' + Date.now();

            const pre = document.createElement('pre');
            pre.style.cssText = `
                margin: 0;
                font-size: 1rem;
                line-height: 1.6;
            `;

            const codeEl = document.createElement('code');
            codeEl.className = `language-${language}`;
            codeEl.style.cssText = 'color: #d4d4d4;';
            codeEl.textContent = code;

            pre.appendChild(codeEl);
            codeContainer.appendChild(pre);
            modal.appendChild(codeContainer);

            // Add custom scrollbar styles (modern design)
            const style = document.createElement('style');
            style.textContent = `
                #${codeContainer.id}::-webkit-scrollbar {
                    width: 40px;
                }
                #${codeContainer.id}::-webkit-scrollbar-track {
                    background: #1e1e1e;
                }
                #${codeContainer.id}::-webkit-scrollbar-thumb {
                    background: #666666;
                    border-radius: 20px;
                    border: 8px solid #1e1e1e;
                    transition: background 0.3s ease;
                }
                #${codeContainer.id}::-webkit-scrollbar-thumb:hover {
                    background: #888888;
                }
                #${codeContainer.id}::-webkit-scrollbar-thumb:active {
                    background: #555555;
                }
            `;
            document.head.appendChild(style);

            document.body.appendChild(modal);

            // Add line numbers
            addLineNumbers(pre);

            // Highlight code
            if (window.hljs) {
                hljs.highlightElement(codeEl);
            }

            // Zoom functionality
            let currentZoom = 100;
            zoomIn.addEventListener('click', () => {
                currentZoom += 10;
                pre.style.fontSize = (currentZoom / 100) + 'rem';
                zoomLevel.textContent = currentZoom + '%';
            });

            zoomOut.addEventListener('click', () => {
                if (currentZoom > 50) {
                    currentZoom -= 10;
                    pre.style.fontSize = (currentZoom / 100) + 'rem';
                    zoomLevel.textContent = currentZoom + '%';
                }
            });

            // Close functionality
            closeBtn.addEventListener('click', () => {
                document.body.removeChild(modal);
            });

            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    document.body.removeChild(modal);
                }
            });
        }

        function addLineNumbers(pre) {
            const code = pre.querySelector('code');
            const lines = code.textContent.split('\n');
            // Remove trailing empty line if it exists
            if (lines.length > 0 && lines[lines.length - 1] === '') {
                lines.pop();
            }

            // Create wrapper for flex layout
            const wrapper = document.createElement('div');
            wrapper.style.cssText = `
                display: flex;
                gap: 1.5rem;
                align-items: flex-start;
            `;

            const lineNumbersDiv = document.createElement('div');
            lineNumbersDiv.style.cssText = `
                color: #858585;
                user-select: none;
                line-height: 1.6;
                text-align: right;
                flex-shrink: 0;
            `;

            for (let i = 0; i < lines.length + 1; i++) {
                const lineNum = document.createElement('div');
                lineNum.textContent = (i + 1);
                lineNum.style.cssText = 'font-size: inherit;';
                lineNumbersDiv.appendChild(lineNum);
            }

            wrapper.appendChild(lineNumbersDiv);
            wrapper.appendChild(code);

            // Clear pre and rebuild with wrapper
            pre.textContent = '';
            pre.appendChild(wrapper);
        }

        function renderPager() {
            const pager = document.getElementById('pager');
            pager.innerHTML = '';

            if (currentPageIndex === -1) return;

            const prev = currentPageIndex > 0 ? allPages[currentPageIndex - 1] : null;
            const next = currentPageIndex < allPages.length - 1 ? allPages[currentPageIndex + 1] : null;

            if (prev) {
                pager.innerHTML += `

        function toggleSidebar() {
            const sidebar = document.getElementById('readerSidebar');
            const container = document.querySelector('.reader-layout-container');
            const isMobile = window.innerWidth <= 900;

            if (isMobile) {
                sidebar.classList.toggle('open');
            } else {
                sidebar.classList.toggle('hidden');
                container.classList.toggle('sidebar-hidden');
                const isHidden = sidebar.classList.contains('hidden');
                localStorage.setItem('sidebarHidden', isHidden);
            }
        }

        function restoreSidebarState() {
            const isMobile = window.innerWidth <= 900;
            if (!isMobile) {
                const isHidden = localStorage.getItem('sidebarHidden') === 'true';
                const sidebar = document.getElementById('readerSidebar');
                const container = document.querySelector('.reader-layout-container');
                if (isHidden) {
                    sidebar.classList.add('hidden');
                    container.classList.add('sidebar-hidden');
                }
