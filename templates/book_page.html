        function initReadingMode() {
            const body = document.body;
            let savedTheme = null;

            // Load saved preference. Students on phones ALWAYS read in reading
            // mode — it's the app-like, distraction-free view — so coming back
            // from a quiz can never land them on the desktop layout.
            const isMobileStudent = window.innerWidth <= 768 && !window.__isAdmin__;
            const isReadingMode = isMobileStudent || localStorage.getItem('readingMode') === 'true';
            if (isReadingMode) {
                body.classList.add('reading-mode');
                body.setAttribute('data-theme', 'light');
            }

            const enterReadingMode = () => {
                body.classList.add('reading-mode');
                savedTheme = body.getAttribute('data-theme') || 'light';
                body.setAttribute('data-theme', 'light');
                localStorage.setItem('readingMode', 'true');
                const timerEl = document.getElementById('sectionTimer');
                if (timerEl) timerEl.style.display = 'block';
                const headerExitBtn = document.getElementById('headerExitReadingBtn');
                if (headerExitBtn) headerExitBtn.style.display = 'flex';
                setTimeout(() => loadPage(), 100);
            };

            const exitReadingMode = () => {
                if (!body.classList.contains('reading-mode')) return;
                // Capture the page the user is actually on (scrolled to) before we tear down the reader
                const targetPageId = getCurrentReadingPageId();
                body.classList.remove('reading-mode');
                if (savedTheme) {
                    body.setAttribute('data-theme', savedTheme);
                }
                localStorage.setItem('readingMode', 'false');
                const timerEl = document.getElementById('sectionTimer');
                if (timerEl) timerEl.style.display = 'none';
                const headerExitBtn = document.getElementById('headerExitReadingBtn');
                if (headerExitBtn) headerExitBtn.style.display = 'none';
                // If the user scrolled to a different page while reading, revert to just
                // that page rather than the one they entered reading mode on.
                if (targetPageId && targetPageId !== pageId) {
                    window.location.href = `/book/${bookFolder}/page/${targetPageId}`;
                    return;
                }
                setTimeout(() => loadPage(), 100);
            };

            // Enter reading mode button
            const enterBtn = document.getElementById('enterReadingModeBtn');
            if (enterBtn) enterBtn.addEventListener('click', enterReadingMode);

            // Header exit button
            const headerExitBtn = document.getElementById('headerExitReadingBtn');
            if (headerExitBtn) headerExitBtn.addEventListener('click', exitReadingMode);

            // Floating exit button (hide it, we'll use header version)
            const exitBtn = document.getElementById('exitReadingBtn');
            if (exitBtn) {
                exitBtn.style.display = 'none';
                exitBtn.addEventListener('click', exitReadingMode);
            }

            // Escape key always exits reading mode
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') exitReadingMode();
            });
        }

        function toggleSidebarCollapse() {
            const sidebar = document.getElementById('readerSidebar');
            if (sidebar) {
                sidebar.classList.toggle('sidebar--collapsed');
                const isCollapsed = sidebar.classList.contains('sidebar--collapsed');
                localStorage.setItem('sidebarCollapsed', isCollapsed);
            }
        }

        function restoreSidebarCollapse() {
            const sidebar = document.getElementById('readerSidebar');
            if (sidebar) {
                const isCollapsed = localStorage.getItem('sidebarCollapsed') === 'true';
                if (isCollapsed) {
                    sidebar.classList.add('sidebar--collapsed');
                }
            }
        }

        // ---- Drag-to-resize the contents sidebar ----------------------------
        // The sidebar width is driven by the --sidebar-width custom property on
        // the layout container. Dragging the right-edge handle updates it live,
        // clamped to a sensible range, and the choice is persisted.
        const SIDEBAR_MIN_WIDTH = 220;
        const SIDEBAR_MAX_WIDTH = 560;

        function applySidebarWidth(width) {
            const container = document.querySelector('.reader-layout-container');
            if (container) {
                container.style.setProperty('--sidebar-width', width + 'px');
            }
        }

        function restoreSidebarWidth() {
            const saved = parseInt(localStorage.getItem('sidebarWidth'), 10);
            if (!isNaN(saved)) {
                const clamped = Math.min(SIDEBAR_MAX_WIDTH, Math.max(SIDEBAR_MIN_WIDTH, saved));
                applySidebarWidth(clamped);
            }
        }

        function initSidebarResize() {
            const handle = document.getElementById('sidebarResizeHandle');
            const sidebar = document.getElementById('readerSidebar');
            const container = document.querySelector('.reader-layout-container');
            if (!handle || !sidebar || !container) return;

            let dragging = false;

            const onMove = (e) => {
                if (!dragging) return;
                // Sidebar starts at the left edge of the container.
                const left = container.getBoundingClientRect().left;
                let width = e.clientX - left;
                width = Math.min(SIDEBAR_MAX_WIDTH, Math.max(SIDEBAR_MIN_WIDTH, width));
                applySidebarWidth(width);
            };

            const stop = () => {
                if (!dragging) return;
                dragging = false;
                container.classList.remove('sidebar-resizing');
                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('mouseup', stop);
                const current = parseInt(getComputedStyle(container).getPropertyValue('--sidebar-width'), 10);
                if (!isNaN(current)) localStorage.setItem('sidebarWidth', current);
            };

            handle.addEventListener('mousedown', (e) => {
                // Ignore when the sidebar is collapsed or hidden.
                if (sidebar.classList.contains('sidebar--collapsed') || sidebar.classList.contains('hidden')) return;
                e.preventDefault();
                dragging = true;
                container.classList.add('sidebar-resizing');
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', stop);
            });

            // Double-click the handle to reset to the default width.
            handle.addEventListener('dblclick', () => {
                container.style.removeProperty('--sidebar-width');
                localStorage.removeItem('sidebarWidth');
            });
        }

        // ---- Inline edit-in-place -------------------------------------------
        // Clicking a section's ✏️ turns that block into editable fields right on
        // the reading page (no navigation, no separate editor), so what you edit
        // is literally the rendered element. Saving posts the whole page content
        // back to the same endpoint the editor uses.
        // ---- Inline page editing (admin) ------------------------------------
        // The reading page IS the editor. Clicking a section ✏️ (or the header
        // ✏️) enters edit mode: a floating format toolbar appears and every
        // block becomes editable in place with move / resize / delete controls.
        // Saving posts the whole page back to the same endpoint the old editor
        // used — so there's no separate editor page.
        let pageEditMode = false;

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text == null ? '' : text;
            return div.innerHTML;
        }

        function getBlockContainer(blockIndex) {
            return document.querySelector(`.block-container[data-block-index="${blockIndex}"]`);
        }

        // Rich-text formatting — acts on whatever contenteditable field is focused.
        function fmt(command, value) {
            if (command === 'indent' || command === 'outdent') {
                adjustIndent(command === 'indent' ? 1 : -1);
                return;
            }
            document.execCommand(command, false, value || null);
        }

        /* ---- Text-colour palette + spectrum popover ---- */
        // Saved caret/selection so the colour survives the input stealing focus.
        let savedColorRange = null;
        let colorGridBuilt = false;

        function saveColorSelection() {
            const sel = window.getSelection();
            if (sel && sel.rangeCount > 0) {
                savedColorRange = sel.getRangeAt(0).cloneRange();
            }
        }

        function restoreColorSelection() {
            if (!savedColorRange) return;
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(savedColorRange);
        }

        // Convert HSL → hex so execCommand('foreColor') is happy on every engine.
        function hslToHex(h, s, l) {
            s /= 100; l /= 100;
            const a = s * Math.min(l, 1 - l);
            const f = n => {
                const k = (n + h / 30) % 12;
                const c = l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1));
                return Math.round(255 * c).toString(16).padStart(2, '0');
            };
            return `#${f(0)}${f(8)}${f(4)}`;
        }

        function buildTextColorPalette() {
            const grid = document.getElementById('colorGrid');
            if (!grid) return;
            const colors = [];
            // Row 1: grayscale, black → white.
            for (let i = 0; i < 10; i++) {
                colors.push(hslToHex(0, 0, Math.round((i / 9) * 100)));
            }
            // Rows 2-7: a hue spectrum (columns) across light → dark shades (rows).
            const hues = [0, 25, 45, 60, 100, 150, 190, 215, 260, 305];
            const shades = [
                { s: 70, l: 85 }, { s: 75, l: 72 }, { s: 78, l: 58 },
                { s: 80, l: 46 }, { s: 82, l: 36 }, { s: 85, l: 26 }
            ];
            shades.forEach(sh => hues.forEach(h => colors.push(hslToHex(h, sh.s, sh.l))));

            grid.innerHTML = '';
            colors.forEach(c => {
                const b = document.createElement('button');
                b.type = 'button';
                b.className = 'color-swatch';
                b.style.background = c;
                b.title = c;
                // Keep the text selection alive (like the other toolbar buttons).
                b.addEventListener('mousedown', e => e.preventDefault());
                b.addEventListener('click', () => applyTextColor(c));
                grid.appendChild(b);
            });
            colorGridBuilt = true;
        }

        function applyTextColor(color) {
            if (!color) return;
            restoreColorSelection();
            document.execCommand('foreColor', false, color);
            const bar = document.getElementById('textColorBar');
            if (bar) bar.style.background = color;
            const input = document.getElementById('customColorInput');
            if (input && /^#[0-9a-f]{6}$/i.test(color)) input.value = color;
            closeColorPopover();
        }

        function toggleColorPopover(event) {
            event.stopPropagation();
            const pop = document.getElementById('textColorPopover');
            if (!pop) return;
            if (pop.style.display !== 'none') { closeColorPopover(); return; }
            if (!colorGridBuilt) buildTextColorPalette();
            saveColorSelection();
            pop.style.display = 'block';
        }

        function closeColorPopover() {
            const pop = document.getElementById('textColorPopover');
            if (pop) pop.style.display = 'none';
        }

        // Dismiss the popover when clicking anywhere outside it.
        document.addEventListener('mousedown', function (e) {
            const pop = document.getElementById('textColorPopover');
            if (!pop || pop.style.display === 'none') return;
            if (!e.target.closest('.tb-color')) closeColorPopover();
        });

        // Manual indent/outdent. execCommand('indent') is unreliable inside
        // webviews (it does nothing or wraps content in a <blockquote>), so we
        // adjust the left margin of every block element the selection spans. The
        // targets must live *inside* the editable field, since only the field's
        // innerHTML is persisted on save — styling the field itself would be lost.
        const INDENT_STEP = 2; // em per indent level

        // Resolve the nearest block-level element around a node, inside the
        // editable field. If the node lives directly in the field (bare text
        // with no block wrapper), wrap the field's content once so the indent
        // has an element to hold and survives serialisation on save.
        function resolveIndentBlock(editable, node) {
            if (node.nodeType === Node.TEXT_NODE) node = node.parentElement;
            let block = node;
            while (block && block !== editable &&
                   getComputedStyle(block).display === 'inline') {
                block = block.parentElement;
            }
            if (!block || block === editable) {
                let wrap = editable.firstElementChild;
                if (!(wrap && wrap.matches('div.indent-wrap') &&
                      editable.childNodes.length === 1)) {
                    wrap = document.createElement('div');
                    wrap.className = 'indent-wrap';
                    while (editable.firstChild) wrap.appendChild(editable.firstChild);
                    editable.appendChild(wrap);
                }
                block = wrap;
            }
            return block;
        }

        function applyIndent(block, direction) {
            const current = parseFloat(block.style.marginLeft) || 0;
            const next = Math.max(0, current + direction * INDENT_STEP);
            block.style.marginLeft = next ? next + 'em' : '';
        }

        // Leaf block-level elements (paragraphs, headings, list items) within
        // the field — the units we indent when a selection spans several.
        function getLeafBlocks(editable) {
            return Array.from(editable.querySelectorAll('*')).filter(node => {
                const d = getComputedStyle(node).display;
                if (d !== 'block' && d !== 'list-item') return false;
                return !Array.from(node.children).some(c => {
                    const cd = getComputedStyle(c).display;
                    return cd === 'block' || cd === 'list-item';
                });
            });
        }

        // Nearest block-level element around a node (read-only — never wraps),
        // used to decide whether a selection stays inside a single paragraph.
        function nearestBlock(editable, node) {
            if (node.nodeType === Node.TEXT_NODE) node = node.parentElement;
            while (node && node !== editable &&
                   getComputedStyle(node).display === 'inline') {
                node = node.parentElement;
            }
            return node || editable;
        }

        // The indent span an existing selection already sits inside, if any.
        function findIndentSpan(range) {
            let n = range.commonAncestorContainer;
            if (n.nodeType === Node.TEXT_NODE) n = n.parentElement;
            return n && n.closest ? n.closest('span.text-indent') : null;
        }

        function unwrapEl(el) {
            const parent = el.parentNode;
            if (!parent) return;
            while (el.firstChild) parent.insertBefore(el.firstChild, el);
            parent.removeChild(el);
            parent.normalize();
        }

        // Indent only the highlighted text (not the whole paragraph) by wrapping
        // the selection in an inline span with a left margin. Re-indenting the
        // same run bumps the margin; outdenting to zero unwraps it.
        function indentSelectedText(range, direction) {
            const existing = findIndentSpan(range);
            if (existing) {
                const cur = parseFloat(existing.style.marginLeft) || 0;
                const next = Math.max(0, cur + direction * INDENT_STEP);
                if (next) existing.style.marginLeft = next + 'em';
                else unwrapEl(existing);
                return true;
            }
            if (direction < 0) return false; // nothing wrapped to outdent

            const span = document.createElement('span');
            span.className = 'text-indent';
            // Block-level so the margin indents every wrapped line of the
            // selection, not just the first (inline margin only shifts line one).
            span.style.display = 'block';
            span.style.marginLeft = INDENT_STEP + 'em';
            try {
                range.surroundContents(span);
            } catch (e) {
                // Selection boundaries split an element — extract and re-insert.
                span.appendChild(range.extractContents());
                range.insertNode(span);
            }

            // Keep the wrapped text selected so repeated indents keep stacking.
            const sel = window.getSelection();
            sel.removeAllRanges();
            const r = document.createRange();
            r.selectNodeContents(span);
            sel.addRange(r);
            return true;
        }

        // The <li> a node sits in, if that item is inside the editable field.
        function listItemFor(editable, node) {
            if (node && node.nodeType === Node.TEXT_NODE) node = node.parentElement;
            if (!node || !node.closest) return null;
            const li = node.closest('li');
            return li && editable.contains(li) ? li : null;
        }

        function adjustIndent(direction) {
            const editable = document.activeElement &&
                document.activeElement.closest('[contenteditable="true"]');
            if (!editable) return;

            const sel = window.getSelection();
            if (!sel || sel.rangeCount === 0) return;
            const range = sel.getRangeAt(0);

            if (!range.collapsed) {
                const startB = nearestBlock(editable, range.startContainer);
                const endB = nearestBlock(editable, range.endContainer);

                // A list item always indents as a whole. Wrapping just the selected
                // run in a block span would shift the text while leaving the bullet
                // behind, since the marker is positioned against the <li>'s own box.
                // Only short-circuit when the whole selection is within ONE item —
                // a selection covering several must fall through to the multi-block
                // path below so every item it touches moves.
                const startLi = listItemFor(editable, startB);
                const endLi = listItemFor(editable, endB);
                if (startLi && startLi === endLi) {
                    applyIndent(startLi, direction);
                    return;
                }

                // Selection within a single paragraph → indent just the
                // highlighted text, honouring exactly what's selected.
                if (startB === endB) {
                    if (indentSelectedText(range, direction)) return;
                    // Nothing wrapped to outdent — fall back to the block so a
                    // previously block-indented paragraph can still be reduced.
                    applyIndent(resolveIndentBlock(editable, range.startContainer), direction);
                    return;
                }

                // Selection spans multiple paragraphs → indent each one it touches.
                const blocks = getLeafBlocks(editable).filter(b => range.intersectsNode(b));
                if (blocks.length) {
                    // Promote any block inside a list item to the item itself, and
                    // dedupe — several leaf blocks can share one <li>, which would
                    // otherwise indent it twice in a single press.
                    let targets = new Set(blocks.map(b => listItemFor(editable, b) || b));

                    // A list item holding a nested <ul> is not a "leaf block", so it
                    // never reaches the set on its own. Add any intersecting item so a
                    // parent bullet moves along with the children under it.
                    Array.from(editable.querySelectorAll('li'))
                        .filter(li => range.intersectsNode(li))
                        .forEach(li => targets.add(li));

                    // Drop anything nested inside another target: indenting an <li>
                    // already carries its sublist, so indenting both would double the
                    // step for the children and break the relative shape of the list.
                    targets = Array.from(targets).filter(
                        node => !Array.from(targets).some(other => other !== node && other.contains(node))
                    );

                    // Every target shifts by the same step, so the selection moves as
                    // one block and existing indent levels stay in proportion.
                    targets.forEach(b => applyIndent(b, direction));
                    return;
                }
            }

            // Plain caret, no highlight → indent the current block, promoted to the
            // list item when there is one so the bullet travels with the text.
            const caretBlock = resolveIndentBlock(editable, range.startContainer);
            applyIndent(listItemFor(editable, caretBlock) || caretBlock, direction);
        }

        // Ctrl/Cmd+B / I / U work in every editable text field. Browsers normally
        // give contenteditable these for free, but some embedded webviews don't —
        // so we handle them explicitly for consistent behaviour everywhere.
        document.addEventListener('keydown', (e) => {
            const editable = document.activeElement &&
                document.activeElement.closest('[contenteditable="true"]');
            if (!editable) return;

            // Tab / Shift+Tab indent and outdent inside editable content instead
            // of moving focus out of the field.
            if (e.key === 'Tab') {
                e.preventDefault();
                fmt(e.shiftKey ? 'outdent' : 'indent');
                return;
            }

            const isCtrlCmd = e.metaKey || e.ctrlKey;
            if (!isCtrlCmd || e.altKey) return;
            const key = e.key.toLowerCase();
            const command = key === 'b' ? 'bold' : key === 'i' ? 'italic' : key === 'u' ? 'underline' : null;
            if (!command) return;
            e.preventDefault();
            fmt(command);
        });

        function editBlock(blockIndex) {
            enterPageEditMode(blockIndex);
        }

        function enterPageEditMode(focusIndex) {
            if (!window.__isAdmin__ || !currentPageData || !currentPageData.blocks) return;
            pageEditMode = true;
            document.body.classList.add('page-editing');
            const toolbar = document.getElementById('inlineFormatToolbar');
            if (toolbar) toolbar.style.display = 'flex';
            updateEditNavButtons();
            restoreComponentPanelState();
            renderEditableContent();

            if (focusIndex !== undefined && focusIndex !== null) {
                const container = getBlockContainer(focusIndex);
                if (container) {
                    container.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    const field = container.querySelector('[data-field]');
                    if (field) field.focus();
                }
            }
        }

        // Enable/disable the header Back/Forward buttons based on position.
        function updateEditNavButtons() {
            const prevBtn = document.getElementById('editPrevBtn');
            const nextBtn = document.getElementById('editNextBtn');
            const hasPrev = currentPageIndex > 0;
            const hasNext = currentPageIndex >= 0 && currentPageIndex < allPages.length - 1;
            if (prevBtn) prevBtn.disabled = !hasPrev;
            if (nextBtn) nextBtn.disabled = !hasNext;
        }

        // Move to the previous (-1) or next (+1) page. While editing, save first
        // and re-enter edit mode automatically after the reload.
        async function editNavigate(direction) {
            const targetIndex = currentPageIndex + direction;
            if (currentPageIndex === -1 || targetIndex < 0 || targetIndex >= allPages.length) return;
            const target = allPages[targetIndex];
            if (pageEditMode) {
                try {
                    await savePageEdits();
                } catch (e) {
                    return; // Save failed — stay on this page so nothing is lost.
                }
                sessionStorage.setItem('resumePageEdit', '1');
            }
            window.location.href = `/book/${bookFolder}/page/${target.id}`;
        }

        // After navigating between pages while editing, re-enter edit mode.
        function maybeResumePageEdit() {
            if (sessionStorage.getItem('resumePageEdit') === '1') {
                sessionStorage.removeItem('resumePageEdit');
                enterPageEditMode();
            }
        }

        async function exitPageEditMode() {
            try {
                await savePageEdits();
            } catch (e) {
                return; // Save failed — stay in edit mode so nothing is lost.
            }
            pageEditMode = false;
            document.body.classList.remove('page-editing');
            const toolbar = document.getElementById('inlineFormatToolbar');
            if (toolbar) toolbar.style.display = 'none';
            renderContent(currentPageData);
        }

        // Set float/width classes on a block container from an image block's
        // align property ('left' | 'right' | 'full' | undefined = centered).
        function applyImageAlignClass(container, block) {
            container.classList.remove('img-wrap-left', 'img-wrap-right', 'img-full');
            container.style.removeProperty('--img-w');
            if (block.align === 'left') container.classList.add('img-wrap-left');
            else if (block.align === 'right') container.classList.add('img-wrap-right');
            else if (block.align === 'full') container.classList.add('img-full');
            if (block.align === 'left' || block.align === 'right') {
                container.style.setProperty('--img-w', block.width || '45%');
            }
        }

        // A thin "+" insert line targeting position `index` in the blocks array.
        // `side` marks insert points living in the side column.
        function insertPointHTML(index, side) {
            return `<div class="block-insert-point" data-insert-index="${index}" ${side ? 'data-side="1"' : ''}>
                    <button type="button" class="bip-btn" title="Insert component here"
                        onclick="toggleInsertMenu(event, ${index}, ${side ? 'true' : 'false'})">+</button>
                </div>`;
        }

        // Rebuild both columns with every block in editable form + controls,
        // with a "+" insert point before each block and at the end of each column.
        function renderEditableContent() {
            closeInsertMenu();
            const body = document.getElementById('pageBody');
            const sidebar = document.getElementById('pageSidebar');
            body.innerHTML = '';
            sidebar.innerHTML = '';

            const blocks = currentPageData.blocks || [];
            let hasSidebarContent = false;
            let vocabIndex = -1;

            blocks.forEach((block, i) => {
                // Vocabulary is edited in its own full-width panel below, in the
                // same place students see it — not as a sidebar block.
                if (block.type === 'sidebox' && (block.style || '') === 'vocab') {
                    vocabIndex = i;
                    return;
                }

                const container = document.createElement('div');
                container.className = 'block-container editable';
                if (block.type === 'heading') container.classList.add('heading-block');
                container.setAttribute('data-block-index', i);

                const toSidebar = block.type === 'sidebox' ||
                    (['image', 'video', 'pptx', 'slide'].includes(block.type) && block.side);

                container.innerHTML =
                    `<button type="button" class="block-add-btn above" title="Add component above"
                        onclick="openBlockInsertMenu(event, ${i}, ${toSidebar})">+</button>` +
                    blockControlsHTML(block, i) +
                    `<div class="editable-body">${buildEditableBody(block, i)}</div>` +
                    `<button type="button" class="block-add-btn below" title="Add component below"
                        onclick="openBlockInsertMenu(event, ${i + 1}, ${toSidebar})">+</button>`;
                if (block.type === 'image' && !block.side) applyImageAlignClass(container, block);

                const col = toSidebar ? sidebar : body;
                col.insertAdjacentHTML('beforeend', insertPointHTML(i, toSidebar));
                col.appendChild(container);
                if (toSidebar) hasSidebarContent = true;
            });
            body.insertAdjacentHTML('beforeend', insertPointHTML(blocks.length, false));
            sidebar.insertAdjacentHTML('beforeend', insertPointHTML(blocks.length, true));
            renderVocabEditor(vocabIndex);

            // Keep the full width when the side column is empty; it pops in
            // as a drop target only while a block is being dragged (CSS on
            // body.block-dragging overrides these inline styles).
            const grid = document.getElementById('pageContentGrid');
            if (grid) {
                grid.style.gridTemplateColumns = hasSidebarContent ? '2fr 1fr' : '1fr';
                sidebar.style.display = hasSidebarContent ? 'flex' : 'none';
            }

            attachImageResizers();
            attachBlockDragHandles();
        }

        function blockControlsHTML(block, i) {
            const count = currentPageData.blocks.length;
            let extra = '';
            if (block.type === 'heading') {
                extra = `<select onchange="setHeadingLevel(${i}, this.value)" title="Heading level">
                        ${[1, 2, 3, 4].map(l => `<option value="${l}" ${(block.level || 2) == l ? 'selected' : ''}>H${l}</option>`).join('')}
                    </select>`;
            }
            return `<div class="block-controls-strip">
                    ${extra}
                    <button type="button" class="block-drag-handle" data-drag-index="${i}" title="Drag to move">⠿</button>
                    <button type="button" onclick="moveBlockInline(${i}, -1)" ${i === 0 ? 'disabled' : ''} title="Move up">↑</button>
                    <button type="button" onclick="moveBlockInline(${i}, 1)" ${i === count - 1 ? 'disabled' : ''} title="Move down">↓</button>
                    <button type="button" onclick="deleteBlockInline(${i})" title="Delete section">🗑</button>
                </div>`;
        }

        // Editable body per block — reuses buildInlineEditor, except images get a
        // live preview with a drag-resize handle.
        function buildEditableBody(block, i) {
            if (block.type === 'image') {
                // No source yet → a drop/click upload target instead of bare inputs.
                if (!block.src) {
                    return `<div class="img-empty-drop" data-index="${i}"
                             onclick="pickImageFile(${i})"
                             ondragover="event.preventDefault(); this.classList.add('drag-over');"
                             ondragleave="this.classList.remove('drag-over');"
                             ondrop="handleImageDrop(event, ${i})">
                            🖼 Click to upload an image<br>
                            <span style="font-size:0.8rem;">or drag a file here / paste from clipboard</span>
                        </div>
                        <label class="inline-input-label" style="margin-top:0.5rem;">…or paste an image URL
                            <input class="inline-input" data-field="src" data-raw="1" value=""
                                onchange="collectPageEdits(); renderEditableContent();">
                        </label>`;
                }
                const wrap = block.align === 'left' || block.align === 'right';
                const w = wrap || block.align === 'full' ? '100%' : (block.width || 'auto');
                const alignBtn = (a, icon, label) =>
                    `<button type="button" class="${(block.align || 'center') === a ? 'active' : ''}"
                         onclick="setImageAlign(${i}, '${a}')" title="${label}">${icon}</button>`;
                return `<div class="editable-image" data-index="${i}" onclick="selectImage(event, this)">
                        <div class="img-toolbar" onclick="event.stopPropagation()">
                            ${alignBtn('left', '◧', 'Wrap text right of image')}
                            ${alignBtn('center', '▣', 'Centered, own line')}
                            ${alignBtn('right', '◨', 'Wrap text left of image')}
                            ${alignBtn('full', '⬌', 'Full width')}
                            <span class="img-tb-divider"></span>
                            <button type="button" onclick="pickImageFile(${i})" title="Upload / replace image">⤴</button>
                            <button type="button" onclick="promptImageUrl(${i})" title="Set image URL">🔗</button>
                            <button type="button" onclick="deleteBlockInline(${i})" title="Delete image">🗑</button>
                        </div>
                        <img src="${escapeHtml(block.src)}" alt="${escapeHtml(block.alt || '')}"
                             style="width: ${w}; max-width: 100%;" onerror="this.src='/static/images/placeholder.png'">
                        <span class="img-resize-handle" data-index="${i}"></span>
                    </div>
                    <input class="inline-input" data-field="caption" data-raw="1"
                        placeholder="Add a caption…" value="${escapeHtml(block.caption || '')}"
                        style="margin-top:0.4rem; font-size:0.85rem; text-align:center; border:none; background:transparent; width:100%;">`;
            }
            return buildInlineEditor(block);
        }

        // ---- Image block interactions ----
        function selectImage(event, wrap) {
            document.querySelectorAll('.editable-image.selected').forEach(el => {
                if (el !== wrap) el.classList.remove('selected');
            });
            wrap.classList.add('selected');
            event.stopPropagation();
        }

        // Click anywhere else deselects images.
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.editable-image')) {
                document.querySelectorAll('.editable-image.selected')
                    .forEach(el => el.classList.remove('selected'));
            }
        });

        function setImageAlign(i, align) {
            collectPageEdits();
            const block = currentPageData.blocks[i];
            if (!block) return;
            block.align = align === 'center' ? undefined : align;
            // Wrapped images need a sensible starting width to wrap around.
            if ((align === 'left' || align === 'right') &&
                (!block.width || block.width === '100%')) {
                block.width = '45%';
            }
            renderEditableContent();
            const wrap = document.querySelector(`.editable-image[data-index="${i}"]`);
            if (wrap) wrap.classList.add('selected');
        }

        function promptImageUrl(i) {
            collectPageEdits();
            const block = currentPageData.blocks[i];
            const url = prompt('Image URL or path:', block.src || '');
            if (url === null) return;
            block.src = url.trim();
            renderEditableContent();
        }

        // Hidden file input shared by all "upload" entry points.
        let pendingUploadIndex = null;
        function pickImageFile(i) {
            pendingUploadIndex = i;
            let input = document.getElementById('imgUploadInput');
            if (!input) {
                input = document.createElement('input');
                input.type = 'file';
                input.accept = 'image/*';
                input.id = 'imgUploadInput';
                input.style.display = 'none';
                document.body.appendChild(input);
                input.addEventListener('change', () => {
                    if (input.files && input.files[0] && pendingUploadIndex !== null) {
                        uploadImageForBlock(input.files[0], pendingUploadIndex);
                    }
                    input.value = '';
                });
            }
            input.click();
        }

        async function uploadImageForBlock(file, i) {
            collectPageEdits();
            const block = currentPageData.blocks[i];
            if (!block) return;
            try {
                const form = new FormData();
                form.append('image', file, file.name || 'image.png');
                const resp = await fetch(`/api/book/${bookFolder}/upload-image`, {
                    method: 'POST', body: form
                });
                const data = await resp.json();
                if (!resp.ok || !data.success) throw new Error(data.error || 'HTTP ' + resp.status);
                block.src = data.src;
                renderEditableContent();
            } catch (e) {
                alert('Image upload failed: ' + e.message);
            }
        }

        function handleImageDrop(event, i) {
            event.preventDefault();
            event.currentTarget.classList.remove('drag-over');
            const file = event.dataTransfer && event.dataTransfer.files && event.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) uploadImageForBlock(file, i);
        }

        // Pasting an image while editing inserts a new image block (after the
        // block being edited, or at the end) and uploads the clipboard data.
        document.addEventListener('paste', (e) => {
            if (!pageEditMode) return;
            const items = e.clipboardData && e.clipboardData.items;
            if (!items) return;
            for (const item of items) {
                if (item.type.startsWith('image/')) {
                    e.preventDefault();
                    const file = item.getAsFile();
                    const focused = document.activeElement &&
                        document.activeElement.closest('.block-container.editable');
                    const at = focused
                        ? parseInt(focused.getAttribute('data-block-index'), 10) + 1
                        : currentPageData.blocks.length;
                    addBlockInline('image', false, at);
                    uploadImageForBlock(file, at);
                    return;
                }
            }
        });

        function moveBlockInline(i, dir) {
            const blocks = currentPageData.blocks;
            const j = i + dir;
            if (j < 0 || j >= blocks.length) return;
            collectPageEdits();
            [blocks[i], blocks[j]] = [blocks[j], blocks[i]];
            renderEditableContent();
        }

        function deleteBlockInline(i) {
            if (!confirm('Delete this section? This cannot be undone until you leave without saving.')) return;
            collectPageEdits();
            currentPageData.blocks.splice(i, 1);
            renderEditableContent();
        }

        function setHeadingLevel(i, level) {
            collectPageEdits();
            currentPageData.blocks[i].level = parseInt(level, 10);
            renderEditableContent();
        }

        // Media block types that can live in either the main or the side column.
        const SIDE_CAPABLE_TYPES = ['image', 'video', 'pptx', 'slide'];

        // Add a new block. `side` routes media blocks into the side column
        // (sidebox is always a side component regardless of the flag).
        // `atIndex` inserts at that position; omitted = append at the end.
        function addBlockInline(type, side, atIndex) {
            if (!type) return;
            collectPageEdits();
            const defaults = {
                heading: { type: 'heading', level: 2, text: 'New heading' },
                text: { type: 'text', text: 'New paragraph' },
                sidebox: { type: 'sidebox', style: 'study', title: 'Note', text: 'Add your note here.' },
                vocab: { type: 'sidebox', style: 'vocab', title: 'Vocabulary', text: 'Term — definition.' },
                atl: { type: 'sidebox', style: 'atl', title: 'ATL Skills', text: 'Which Approaches to Learning skills does this develop?' },
                intlmind: { type: 'sidebox', style: 'intlmind', title: 'International Mindedness', text: 'How does this connect to global contexts and perspectives?' },
                question: { type: 'question', text: 'New question?', answer: 'Mark scheme / answer.' },
                guiding: { type: 'guiding', title: 'Guiding Questions', text: 'What is the core idea here?\nWhy does it matter?\nHow could you apply it?' },
                code: { type: 'code', language: 'python', code: '# your code here' },
                image: { type: 'image', src: '', alt: '', caption: '' },
                video: { type: 'video', src: '', title: '' },
                slide: { type: 'slide', src: '', title: '' },
            };
            const base = defaults[type];
            if (!base) return;
            const block = JSON.parse(JSON.stringify(base));
            if (side && SIDE_CAPABLE_TYPES.includes(type)) {
                block.side = true;
            }
            const insertAt = (atIndex === undefined || atIndex === null)
                ? currentPageData.blocks.length
                : Math.max(0, Math.min(atIndex, currentPageData.blocks.length));
            currentPageData.blocks.splice(insertAt, 0, block);
            renderEditableContent();
            const container = getBlockContainer(insertAt);
            if (container) {
                container.scrollIntoView({ behavior: 'smooth', block: 'center' });
                const field = container.querySelector('[data-field]');
                if (field) field.focus();
            }
        }

        // Entry point for the right-hand "Add component" palette.
        function addComponent(type, side) {
            if (!pageEditMode) return;
            addBlockInline(type, side);
        }

        // ---- "+" insert menu between blocks ----
        // Components offered by the inline + menu: [type, icon, label].
        const INSERT_MENU_ITEMS = [
            ['heading', 'H', 'Heading'],
            ['text', '¶', 'Paragraph'],
            ['image', '🖼', 'Image'],
            ['video', '🎬', 'Video'],
            ['question', '❓', 'Question'],
            ['code', '</>', 'Code'],
            ['guiding', '🧭', 'Guiding'],
            ['slide', '📽', 'Slides'],
        ];
        const INSERT_MENU_ITEMS_SIDE = [
            ['sidebox', '💡', 'Info box'],
            ['vocab', '📖', 'Vocab'],
            ['atl', '🛠', 'ATL'],
            ['intlmind', '🌍', 'Intl mind'],
            ['image', '🖼', 'Image'],
            ['video', '🎬', 'Video'],
            ['slide', '📽', 'Slides'],
        ];

        function closeInsertMenu() {
            const menu = document.getElementById('bipMenu');
            if (menu) menu.remove();
            document.querySelectorAll('.block-insert-point.menu-open')
                .forEach(el => el.classList.remove('menu-open'));
        }

        function toggleInsertMenu(event, index, side) {
            event.stopPropagation();
            const point = event.target.closest('.block-insert-point');
            const wasOpen = point && point.classList.contains('menu-open');
            closeInsertMenu();
            if (wasOpen || !point) return;
            openInsertMenuOn(point, index, side);
        }

        // From a block's above/below "+" — anchor the menu on the matching
        // insert point between blocks (same index/side the line would use).
        function openBlockInsertMenu(event, index, side) {
            event.stopPropagation();
            const selector = `.block-insert-point[data-insert-index="${index}"]` +
                (side ? '[data-side="1"]' : ':not([data-side])');
            const point = document.querySelector(selector);
            const wasOpen = point && point.classList.contains('menu-open');
            closeInsertMenu();
            if (wasOpen || !point) return;
            openInsertMenuOn(point, index, side);
        }

        function openInsertMenuOn(point, index, side) {
            const items = side ? INSERT_MENU_ITEMS_SIDE : INSERT_MENU_ITEMS;
            const menu = document.createElement('div');
            menu.className = 'bip-menu';
            menu.id = 'bipMenu';
            menu.innerHTML = items.map(([type, icon, label]) =>
                `<button type="button" onclick="closeInsertMenu(); addBlockInline('${type}', ${side}, ${index})">
                    <span class="bip-ic">${icon}</span>${label}
                </button>`).join('');
            point.appendChild(menu);
            point.classList.add('menu-open');
        }

        document.addEventListener('mousedown', (e) => {
            if (!e.target.closest('.bip-menu') && !e.target.closest('.bip-btn') &&
                !e.target.closest('.block-add-btn')) closeInsertMenu();
        });

        // ---- Drag a block by its ⠿ grip and drop it on any insert point ----
        function blockDragLabel(block) {
            const text = (block.title || block.text || block.alt || block.src || '')
                .replace(/<[^>]*>/g, '').slice(0, 40);
            return `${block.type}${text ? ': ' + text : ''}`;
        }

        function attachBlockDragHandles() {
            document.querySelectorAll('.block-drag-handle').forEach(handle => {
                handle.addEventListener('pointerdown', startBlockDrag);
            });
        }

        function startBlockDrag(e) {
            e.preventDefault();
            const fromIndex = parseInt(e.currentTarget.dataset.dragIndex, 10);
            const block = currentPageData.blocks[fromIndex];
            if (!block) return;
            collectPageEdits();

            const source = getBlockContainer(fromIndex);
            let ghost = null;
            let activePoint = null;
            let started = false;
            const startX = e.clientX, startY = e.clientY;

            const onMove = (ev) => {
                // Small dead zone so a stray click doesn't start a drag.
                if (!started && Math.hypot(ev.clientX - startX, ev.clientY - startY) < 5) return;
                if (!started) {
                    started = true;
                    document.body.classList.add('block-dragging');
                    if (source) source.classList.add('drag-source');
                    ghost = document.createElement('div');
                    ghost.id = 'blockDragGhost';
                    ghost.textContent = '⠿ ' + blockDragLabel(block);
                    document.body.appendChild(ghost);
                }
                ghost.style.left = (ev.clientX + 12) + 'px';
                ghost.style.top = (ev.clientY + 12) + 'px';

                // Highlight the insert point nearest the pointer (same column
                // proximity comes free since distance is measured to the line).
                let best = null, bestDist = Infinity;
                document.querySelectorAll('.block-insert-point').forEach(p => {
                    const r = p.getBoundingClientRect();
                    if (ev.clientX < r.left - 60 || ev.clientX > r.right + 60) return;
                    const d = Math.abs(ev.clientY - (r.top + r.height / 2));
                    if (d < bestDist) { bestDist = d; best = p; }
                });
                if (activePoint && activePoint !== best) activePoint.classList.remove('drop-active');
                activePoint = (best && bestDist < 160) ? best : null;
                if (activePoint) activePoint.classList.add('drop-active');
            };

            const onUp = () => {
                document.removeEventListener('pointermove', onMove);
                document.removeEventListener('pointerup', onUp);
                document.body.classList.remove('block-dragging');
                if (ghost) ghost.remove();
                if (source) source.classList.remove('drag-source');
                if (!started || !activePoint) return;

                let toIndex = parseInt(activePoint.dataset.insertIndex, 10);
                const toSide = activePoint.dataset.side === '1';
                activePoint.classList.remove('drop-active');

                const blocks = currentPageData.blocks;
                const [moved] = blocks.splice(fromIndex, 1);
                if (toIndex > fromIndex) toIndex--;
                // Column move: media blocks flip their side flag; sideboxes
                // always live in the side column, other types in the main one.
                if (SIDE_CAPABLE_TYPES.includes(moved.type)) {
                    if (toSide) moved.side = true; else delete moved.side;
                }
                blocks.splice(toIndex, 0, moved);
                renderEditableContent();
            };

            document.addEventListener('pointermove', onMove);
            document.addEventListener('pointerup', onUp);
        }

        // ---- Component palette: hide / show + drag to move ----
        function hideComponentPanel() {
            document.body.classList.add('acp-collapsed');
            localStorage.setItem('acpCollapsed', '1');
        }

        function showComponentPanel() {
            document.body.classList.remove('acp-collapsed');
            localStorage.removeItem('acpCollapsed');
        }

        function applyComponentPanelPos(panel, left, top) {
            panel.style.right = 'auto';
            panel.style.left = left + 'px';
            panel.style.top = top + 'px';
        }

        // Restore the palette's collapsed/hidden state (called on entering edit mode).
        function restoreComponentPanelState() {
            if (localStorage.getItem('acpCollapsed') === '1') {
                document.body.classList.add('acp-collapsed');
            } else {
                document.body.classList.remove('acp-collapsed');
            }
        }

        function initComponentPanelDrag() {
            const panel = document.getElementById('addComponentPanel');
            const handle = document.getElementById('acpHandle');
            if (!panel || !handle) return;

            // Restore any saved position from a previous session.
            try {
                const saved = JSON.parse(localStorage.getItem('acpPos') || 'null');
                if (saved && typeof saved.left === 'number') {
                    applyComponentPanelPos(panel, saved.left, saved.top);
                }
            } catch (e) { /* ignore malformed */ }

            let dragging = false, startX = 0, startY = 0, startLeft = 0, startTop = 0;

            handle.addEventListener('pointerdown', (e) => {
                if (e.target.closest('.acp-hide')) return; // let the hide button work
                dragging = true;
                const rect = panel.getBoundingClientRect();
                startX = e.clientX; startY = e.clientY;
                startLeft = rect.left; startTop = rect.top;
                applyComponentPanelPos(panel, startLeft, startTop);
                panel.classList.add('acp-dragging');
                try { handle.setPointerCapture(e.pointerId); } catch (_) {}
                e.preventDefault();
            });

            handle.addEventListener('pointermove', (e) => {
                if (!dragging) return;
                const w = panel.offsetWidth, h = panel.offsetHeight;
                let nx = startLeft + (e.clientX - startX);
                let ny = startTop + (e.clientY - startY);
                nx = Math.max(4, Math.min(window.innerWidth - w - 4, nx));
                ny = Math.max(4, Math.min(window.innerHeight - h - 4, ny));
                applyComponentPanelPos(panel, nx, ny);
            });

            const endDrag = (e) => {
                if (!dragging) return;
                dragging = false;
                panel.classList.remove('acp-dragging');
                try { handle.releasePointerCapture(e.pointerId); } catch (_) {}
                const rect = panel.getBoundingClientRect();
                localStorage.setItem('acpPos', JSON.stringify({ left: rect.left, top: rect.top }));
            };
            handle.addEventListener('pointerup', endDrag);
            handle.addEventListener('pointercancel', endDrag);
        }

        // Read every edited field in the DOM back into currentPageData.blocks.
        function collectPageEdits() {
            collectVocabEdits();
            document.querySelectorAll('.block-container.editable').forEach(container => {
                const i = parseInt(container.getAttribute('data-block-index'), 10);
                const block = currentPageData.blocks[i];
                if (!block) return;
                container.querySelectorAll('[data-field]').forEach(el => {
                    const field = el.dataset.field;
                    if (el.dataset.raw) {
                        block[field] = el.value;               // input / textarea (media, code)
                    } else if (el.dataset.single) {
                        block[field] = el.textContent.trim();  // single line (heading/title)
                    } else {
                        block[field] = el.innerHTML.trim();    // rich text
                    }
                });
            });
        }

        function attachImageResizers() {
            document.querySelectorAll('.editable-image').forEach(wrap => {
                const img = wrap.querySelector('img');
                const handle = wrap.querySelector('.img-resize-handle');
                if (!img || !handle) return;

                handle.addEventListener('pointerdown', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    const i = parseInt(handle.dataset.index, 10);
                    const block = currentPageData.blocks[i];
                    const container = wrap.closest('.block-container');
                    // Wrapped images size via the floated container; others via the img.
                    const wrapped = block && (block.align === 'left' || block.align === 'right');
                    const startX = e.clientX;
                    const startW = (wrapped ? container : img).getBoundingClientRect().width;
                    const colEl = wrapped ? container.parentElement : wrap.parentElement;
                    const parentW = colEl.getBoundingClientRect().width || startW;

                    const onMove = (ev) => {
                        const newW = Math.max(40, startW + (ev.clientX - startX));
                        const pct = Math.min(100, Math.round((newW / parentW) * 100));
                        if (wrapped) {
                            container.style.setProperty('--img-w', pct + '%');
                        } else {
                            img.style.width = pct + '%';
                        }
                        if (block) block.width = pct + '%';
                    };
                    const onUp = () => {
                        document.removeEventListener('pointermove', onMove);
                        document.removeEventListener('pointerup', onUp);
                    };
                    document.addEventListener('pointermove', onMove);
                    document.addEventListener('pointerup', onUp);
                });
            });
        }

        async function savePageEdits() {
            if (!pageEditMode) return;
            collectPageEdits();
            const btn = document.getElementById('inlineSaveBtn');
            const originalLabel = btn ? btn.textContent : '';
            if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }

            try {
                const response = await fetch(`/api/content/${bookFolder}/${pageId}/save`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(currentPageData)
                });
                const data = await response.json();
                if (!response.ok || !data.success) {
                    throw new Error(data.error || ('HTTP ' + response.status));
                }
                if (btn) {
                    btn.textContent = '✓ Saved';
                    setTimeout(() => { btn.textContent = originalLabel; btn.disabled = false; }, 1200);
                }
            } catch (e) {
                if (btn) { btn.disabled = false; btn.textContent = originalLabel; }
                alert('Failed to save: ' + e.message);
                throw e;
            }
        }

        function buildInlineEditor(block) {
            switch (block.type) {
                case 'heading': {
                    const lvl = block.level || 2;
                    return `<h${lvl} class="inline-field" data-field="text" data-single="1" contenteditable="true"
                                style="color: var(--primary); margin: 1.5rem 0 0.75rem 0;">${escapeHtml(block.text || '')}</h${lvl}>`;
                }
                case 'text':
                    return `<div class="inline-field" data-field="text" contenteditable="true"
                                style="line-height: 1.8; color: var(--text-dark);">${textBlockToHtml(block.text || '')}</div>`;
                case 'sidebox': {
                    const style = block.style || 'study';
                    return `<div class="sidebar-section ${style}">
                                <h4 class="inline-field" data-field="title" data-single="1" contenteditable="true"
                                    style="margin: 0 0 0.5rem 0; font-size: 1.1rem; font-weight: bold;">${escapeHtml(block.title || '')}</h4>
                                <div class="inline-field" data-field="text" contenteditable="true"
                                    style="line-height: 1.6; font-size: 0.95rem;">${textBlockToHtml(block.text || '')}</div>
                            </div>`;
                }
                case 'question':
                    return `<div class="question-block" style="padding: 1rem; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-light);">
                                <div style="font-weight: bold; margin-bottom: 0.5rem; color: var(--primary);">❓ Question</div>
                                <div class="inline-field" data-field="text" contenteditable="true"
                                    style="font-size: 1.05rem; margin-bottom: 0.75rem;">${textBlockToHtml(block.text || '')}</div>
                                <div style="font-size: 0.85rem; text-transform: uppercase; color: #059669; font-weight: bold; margin-bottom: 0.25rem;">✓ Markscheme</div>
                                <div class="inline-field" data-field="answer" contenteditable="true"
                                    style="color: #059669;">${textBlockToHtml(block.answer || '')}</div>
                            </div>`;
                case 'guiding':
                    return `<div style="border: 1px dashed var(--border); border-radius: 10px; padding: 1rem;">
                                <div style="font-weight: 700; color: var(--primary); margin-bottom: 0.75rem;">🧭 Guiding Questions component</div>
                                <label class="inline-input-label">Heading
                                    <input class="inline-input" data-field="title" data-raw="1" value="${escapeHtml(block.title || 'Guiding Questions')}">
                                </label>
                                <label class="inline-input-label" style="margin-top: 0.75rem;">Questions (one per line)
                                    <textarea class="inline-input" data-field="text" data-raw="1" rows="6"
                                        style="line-height: 1.6; resize: vertical;">${escapeHtml(block.text || '')}</textarea>
                                </label>
                            </div>`;
                case 'code':
                    return `<textarea class="inline-code-textarea" data-field="code" data-raw="1">${escapeHtml(block.code || '')}</textarea>`;
                case 'image':
                    return inlineMediaFields(block, [['src', 'Image URL / path'], ['alt', 'Alt text'], ['caption', 'Caption (optional)']]);
                case 'video':
                    return inlineMediaFields(block, [['src', 'Video URL (YouTube or file)'], ['title', 'Title (optional)']]);
                case 'pptx':
                case 'slide':
                    return inlineMediaFields(block, [['src', 'Slides URL'], ['title', 'Title (optional)']]);
                default:
                    return `<div style="color: var(--text-light);">This block type (${escapeHtml(block.type || 'unknown')}) can't be edited here yet.</div>`;
            }
        }

        function inlineMediaFields(block, fields) {
            return fields.map(([field, label]) =>
                `<label class="inline-input-label">${label}
                    <input class="inline-input" data-field="${field}" data-raw="1" value="${escapeHtml(block[field] || '')}">
                </label>`
            ).join('');
        }

        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            applyHeadingStyles();
            initReadingMode();
            loadPages();
            initComponentPanelDrag();
            const editBtn = document.getElementById('editBtn');
            if (editBtn) {
                editBtn.href = '#';
                editBtn.title = 'Edit this page';
                editBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    if (pageEditMode) { exitPageEditMode(); } else { enterPageEditMode(); }
                });
            }

            // Restore sidebar states on page load
            restoreSidebarState();
            restoreSidebarCollapse();
            restoreSidebarWidth();
            initSidebarResize();

            // Toggle sidebar event listeners
            const sidebar = document.getElementById('readerSidebar');
            const toggleNavBtn = document.getElementById('toggleNavBtn');
            const closeSidebarBtn = document.getElementById('closeSidebarBtn');
            const collapseBtn = document.getElementById('sidebarCollapseBtn');
            const themeToggleFooter = document.getElementById('themeToggleFooter');

            if (toggleNavBtn && sidebar) {
                toggleNavBtn.addEventListener('click', toggleSidebar);
            }
            if (closeSidebarBtn && sidebar) {
                closeSidebarBtn.addEventListener('click', () => {
                    sidebar.classList.remove('open');
                });
            }
            if (collapseBtn) {
                collapseBtn.addEventListener('click', toggleSidebarCollapse);
            }
            if (themeToggleFooter) {
                themeToggleFooter.addEventListener('click', toggleTheme);
            }
            const themeToggleHeader = document.getElementById('themeToggleHeader');
            if (themeToggleHeader) {
                themeToggleHeader.addEventListener('click', toggleTheme);
            }

            // Confidence scale: built here, then handled by delegation so the
            // listener does not depend on the buttons already existing.
            buildConfidenceScale();
            const confidenceWidget = document.getElementById('confidenceWidget');
            if (confidenceWidget) {
                confidenceWidget.addEventListener('click', async (e) => {
                    const btn = e.target.closest('.confidence-btn');
                    if (!btn) return;
                    markConfidenceSelected(btn.dataset.level);
                    await saveConfidenceRating(btn.dataset.level);
                });
            }
        });
    </script>
