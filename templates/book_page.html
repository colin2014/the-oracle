        .sidebar-menu-item:hover {
            background: var(--bg-light);
            color: var(--primary);
        }

        .sidebar-menu-item.active {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white !important;
            /* Same leftover-indigo bug as .complete-btn: an #6366f1 glow sitting
               under a violet fill. Tied to the live accent so it tracks the theme. */
            box-shadow: 0 4px 12px color-mix(in srgb, var(--primary) 20%, transparent);
        }

        .sidebar-menu-item .completion-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            display: inline-block;
        }

        /* The five steps were emoji (😟😕😐🙂😄) — the exact substitute-icon-system
           tell DESIGN.md bans, and the reason a screen reader announced this scale
           as "grinning face button". They are drawn faces now, same consistent
           stroke as the nav and figure icons, so the scale still reads at a glance
           without borrowing the platform's emoji font. */
        .confidence-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            padding: 0;
            background: none;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-light);
            cursor: pointer;
            transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
        }

        .confidence-btn svg {
            width: 20px;
            height: 20px;
        }

        /* No scale(1.1) on hover: five buttons sitting 4px apart made the row jump
           as the cursor crossed it. Colour carries the hover instead. */
        .confidence-btn:hover {
            border-color: color-mix(in srgb, var(--primary) 45%, transparent);
            color: var(--primary);
        }

        .confidence-btn.active {
            border-color: var(--primary);
            /* --tint had never been defined anywhere, so this resolved to nothing
               and the selected step had no fill at all. The token exists in
               style.css now; the five other var(--tint) sites on this page were
               dead for the same reason and come back with it. */
            background: var(--tint);
            color: var(--primary);
        }

        /* The scale is one control, so it takes one tab stop and the arrow keys move
           between steps — five separate tab stops for a single 1-5 rating was five
           times the keyboard cost of the two buttons beside it. */
        .confidence-btn:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        /* The title used to be hidden here because every page repeated it as a
           heading block at the top of the body. Those duplicates have been
           removed from the content, so the title now shows once — in the
           sticky bar above the reading card. */

        /* --p runs 0 (expanded, stacked) -> 1 (compact, one line) and is written
           by setupTitlebarScroll from .reader-main-area's scrollTop. Registering it
           keeps it a real number so it is valid inside font-size calc(). */
        @property --p {
            syntax: '<number>';
            inherits: true;
            initial-value: 0;
        }

        /* The bar's height interpolates with --p, so the painted chrome always ends
           exactly at the text and content never shows through below it. The height
           change is only safe because .reader-main-area has overflow-anchor: none —
           otherwise scroll anchoring would correct scrollTop to compensate for the
           shrink, which changes --p, which changes the height again, and the header
           oscillates forever. Do not remove that property. */
        .page-titlebar {
            --p: 0;
            /* --title-lg is overwritten per page by fitTitle(), which solves for the
               largest size that still fits the title on one line next to the chip.
               This value is only the ceiling and the pre-measurement fallback. */
            --title-lg: 3.1rem;
            --title-sm: 1.05rem;
            position: sticky;
            top: 0;
            z-index: 30;
            height: calc(var(--bar-lg, auto) + (var(--bar-sm, 0px) - var(--bar-lg, 0px)) * var(--p));
            overflow: hidden;
            overflow-anchor: none;
            /* Blur and tint ramp in with scroll instead of being on from the start. */
            background: color-mix(in srgb, var(--bg-light) calc(70% + 18% * var(--p)), transparent);
            backdrop-filter: saturate(180%) blur(calc(12px * var(--p)));
            -webkit-backdrop-filter: saturate(180%) blur(calc(12px * var(--p)));
            border-bottom: 1px solid transparent;
        }

        .page-titlebar.is-stuck {
            border-bottom-color: var(--border);
            box-shadow: 0 1px 12px rgba(0, 0, 0, 0.04);
        }

        .page-titlebar-inner {
            display: flex;
            /* Always one line now: chip left, title beside it, at every scroll state. */
            flex-wrap: nowrap;
            align-items: center;
            column-gap: 0.85rem;
            /* Hard left, no centring container: the header hugs the edge of the
               reading column instead of tracking .page-container's 82rem centreline.
               It still follows the sidebar for free, since the whole bar lives inside
               the .reader-main-area grid column that the sidebar resizes. */
            max-width: none;
            margin: 0;
            padding: calc(2.4rem - 1.45rem * var(--p)) 1.5rem calc(2rem - 1.05rem * var(--p)) 1rem;
        }

        .page-topic {
            flex: none;
            order: 1;
            align-self: center;
            white-space: nowrap;
            padding: 0.24em 0.5em;
            border-radius: 5px;
            /* Tint drawn from the existing accent rather than a new colour, and no
               shadow or gradient — at this size the chip is a label, not a button. */
            background: color-mix(in srgb, var(--primary) 9%, transparent);
            box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--primary) 16%, transparent);
            font-family: var(--code-font);
            font-size: calc(0.9rem - 0.16rem * var(--p));
            font-weight: 600;
            letter-spacing: 0.02em;
            font-variant-numeric: tabular-nums;
            color: var(--primary);
        }

        #pageTitleMain { order: 3; }

        #pageTitleMain {
            min-width: 0;
            margin: 0;
            /* Serif while it is a display heading. font-family cannot interpolate, so
               the swap is a hard switch — timed to land during the layout flip, where
               the text is already moving and the change reads as part of the motion
               rather than a glitch. */
            font-family: 'Libertinus Serif', ui-serif, Georgia, 'Times New Roman', serif;
            font-size: calc(var(--title-lg) + (var(--title-sm) - var(--title-lg)) * var(--p));
            font-weight: calc(700 - 100 * var(--p));
            letter-spacing: calc(-0.012em + 0.012em * var(--p));
            line-height: 1.18;
            color: var(--text-dark);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Compact bar is UI, not editorial: hand back to Inter at navbar size, where
           the serif's high contrast would get spindly and fight the rest of the chrome. */
        .page-titlebar.is-condensed #pageTitleMain {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* Libertinus ships 400 and 700 only — no 600. Pin the serif state to a real
           weight so the browser does not synthesise a fake semibold, which smears the
           stroke contrast at display size. The calc() weight applies to Inter, which
           does have the intermediate weights. */
        .page-titlebar:not(.is-condensed) #pageTitleMain {
            font-weight: 700;
        }


        @media (prefers-reduced-motion: reduce) {
            .page-titlebar { --p: 1; }
        }

        body.reading-mode .page-titlebar,
        body.page-editing .page-titlebar {
            display: none !important;
        }

        @media (max-width: 768px) {
            .page-titlebar-inner {
                padding: 0.7rem 1rem 0.7rem 0.75rem;
                gap: 0.5rem;
            }

            .page-titlebar {
                --title-lg: 1.75rem;
                --title-sm: 0.95rem;
            }
        }

        body.reading-mode h1:not(#pageTitle) {
            display: none !important;
        }

        /* Admin Edit Button - Per Section */
        .block-container {
            position: relative;
            width: 100%;
        }

        .block-edit-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 32px;
            height: 32px;
            padding: 0;
            /* Fourth and last leftover-indigo site: this admin control was #6366f1
               while every other accent on the page is the violet --primary. */
            background: color-mix(in srgb, var(--primary) 90%, transparent);
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            /* Was display:none until hover, which meant the control could never take
               keyboard focus — an admin editing by keyboard could not reach a single
               block's edit button. Kept in the layout and hidden visually instead, so
               it is still tabbable and reveals itself when focused. */
            display: flex;
            opacity: 0;
            pointer-events: none;
            align-items: center;
            justify-content: center;
            transition: opacity 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
            z-index: 50;
        }

        .block-container:hover .block-edit-btn,
        .block-edit-btn:focus-visible {
            opacity: 1;
            pointer-events: auto;
        }

        .block-edit-btn:hover {
            background: var(--primary);
            box-shadow: 0 2px 8px color-mix(in srgb, var(--primary) 40%, transparent);
        }

        /* ---- Inline edit-in-place (admin) ---- */
        .block-container.inline-editing {
            outline: 2px solid var(--primary);
            outline-offset: 6px;
            border-radius: 6px;
        }

        .inline-field {
            outline: 1px dashed var(--primary);
            outline-offset: 3px;
            border-radius: 3px;
            min-height: 1.2em;
        }

        .inline-field:focus {
            outline: 2px solid var(--primary);
        }

        .inline-edit-toolbar {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .inline-edit-toolbar button {
            padding: 0.5rem 1.1rem;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .inline-save-btn { background: var(--primary); color: #fff; }
        .inline-save-btn:hover { background: var(--primary-dark); }
        .inline-save-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .inline-cancel-btn { background: var(--bg-light); color: var(--text-dark); border: 1px solid var(--border); }
        .inline-cancel-btn:hover { background: var(--border); }

        .inline-code-textarea {
            width: 100%;
            min-height: 220px;
            padding: 1rem;
            background: #1e1e1e;
            color: #d4d4d4;
            border: none;
            border-radius: 8px;
            font-family: var(--code-font);
            font-size: 0.9rem;
            line-height: 1.5;
            resize: vertical;
            outline: 2px solid var(--primary);
        }

        .inline-input-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-light);
            margin-bottom: 0.75rem;
        }

        .inline-input {
            display: block;
            width: 100%;
            margin-top: 0.25rem;
            padding: 0.5rem 0.65rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font: inherit;
            font-size: 0.95rem;
            background: var(--bg-white);
            color: var(--text-dark);
        }

        /* Adjust heading styling for edit button */
        .block-container h2, .block-container h3, .block-container h4, .block-container h5, .block-container h6 {
            margin-top: 0;
        }

        /* ---- Floating formatting toolbar (inline page edit) ---- */
        .inline-format-toolbar {
            position: fixed;
            top: 64px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 300;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.35rem;
            padding: 0.4rem 0.6rem;
            background: var(--bg-white);
            border: 1px solid var(--border);
            border-radius: 999px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18);
            max-width: min(920px, calc(100vw - 2rem));
        }

        .inline-format-toolbar button,
        .inline-format-toolbar select,
        .inline-format-toolbar input[type="color"] {
            border: 1px solid var(--border);
            background: var(--bg-light);
            color: var(--text-dark);
            border-radius: 6px;
            padding: 0.3rem 0.55rem;
            font-size: 0.85rem;
            cursor: pointer;
            line-height: 1;
        }

        .inline-format-toolbar button:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .inline-format-toolbar input[type="color"] {
            padding: 0.15rem;
            width: 34px;
            height: 30px;
        }

        .inline-format-toolbar .tb-divider {
            width: 1px;
            height: 1.25rem;
            background: var(--border);
            margin: 0 0.15rem;
        }

        .inline-format-toolbar .tb-save {
            background: var(--primary) !important;
            color: #fff !important;
            border-color: var(--primary) !important;
            font-weight: 600;
        }

        .inline-format-toolbar .tb-done {
            background: var(--success, #22c55e) !important;
            color: #fff !important;
            border-color: var(--success, #22c55e) !important;
            font-weight: 600;
        }

        /* ---- Text-colour palette + spectrum popover ---- */
        .tb-color {
            position: relative;
            display: inline-flex;
        }

        .inline-format-toolbar .tb-color-btn {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            min-width: 34px;
            height: 30px;
            padding: 0.15rem 0.4rem;
        }

        .tb-color-label {
            font-weight: 700;
            font-size: 0.9rem;
            line-height: 1;
        }

        .tb-color-bar {
            display: block;
            width: 18px;
            height: 4px;
            border-radius: 2px;
            background: #e53935;
        }

        .color-popover {
            position: absolute;
            top: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 400;
            background: var(--bg-white);
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.22);
            padding: 0.6rem;
            width: max-content;
        }

        .color-popover-title {
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-light);
            margin-bottom: 0.45rem;
        }

        .color-grid {
            display: grid;
            grid-template-columns: repeat(10, 18px);
            gap: 4px;
        }

        .color-swatch {
            width: 18px;
            height: 18px;
            border-radius: 4px;
            border: 1px solid rgba(0, 0, 0, 0.15);
            padding: 0;
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }

        .color-swatch:hover {
            transform: scale(1.18);
            box-shadow: 0 0 0 2px var(--primary);
        }

        .color-popover-divider {
            height: 1px;
            background: var(--border);
            margin: 0.6rem 0;
        }

        .color-custom-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.6rem;
        }

        .color-custom-label {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.8rem;
            color: var(--text-dark);
            cursor: pointer;
        }

        .color-custom-label input[type="color"] {
            width: 30px;
            height: 26px;
            padding: 2px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg-light);
            cursor: pointer;
        }

        .color-clear-btn {
            font-size: 0.78rem;
            padding: 0.3rem 0.6rem;
            border: 1px solid var(--border);
            background: var(--bg-light);
            color: var(--text-dark);
            border-radius: 6px;
            cursor: pointer;
        }

        .color-clear-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* Give the content clearance so the floating toolbar never covers it */
        body.page-editing .page-container {
            padding-top: 4.5rem;
        }

        /* ---- Right-hand "Add component" palette (inline page edit) ---- */
        #addComponentPanel {
            display: none;
            position: fixed;
            top: 64px;
            right: 1rem;
            width: 200px;
            max-height: calc(100vh - 80px);
            z-index: 250;
            overflow-y: auto;
            padding: 0.85rem;
            background: var(--bg-white);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18);
        }

        #addComponentPanel.acp-dragging {
            user-select: none;
            box-shadow: 0 10px 34px rgba(0, 0, 0, 0.28);
        }

        body.page-editing #addComponentPanel {
            display: block;
        }

        /* Hidden state: hide the panel, reveal the reopen tab */
        body.page-editing.acp-collapsed #addComponentPanel {
            display: none;
        }

        body.page-editing.acp-collapsed #addComponentReopen {
            display: flex;
        }

        .acp-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 0.75rem;
            cursor: grab;
            touch-action: none;
            user-select: none;
        }

        #addComponentPanel.acp-dragging .acp-header {
            cursor: grabbing;
        }

        .acp-title-text {
            flex: 1;
            min-width: 0;
        }

        /* Small vertical grip lines (drag handle + reopen tab) */
        .acp-grip {
            width: 12px;
            height: 16px;
            flex-shrink: 0;
            background-image: repeating-linear-gradient(90deg,
                var(--text-light) 0, var(--text-light) 2px,
                transparent 2px, transparent 4px);
            opacity: 0.55;
        }

        .acp-hide {
            flex-shrink: 0;
            background: transparent;
            border: none;
            color: var(--text-light);
            font-size: 0.85rem;
            line-height: 1;
            padding: 0.2rem 0.3rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .acp-hide:hover {
            background: var(--bg-light);
            color: var(--text-dark);
        }

        /* Collapsed reopen tab, docked to the right edge */
        #addComponentReopen {
            display: none;
            position: fixed;
            top: 50%;
            right: 0;
            transform: translateY(-50%);
            z-index: 250;
            width: 22px;
            height: 66px;
            padding: 0;
            align-items: center;
            justify-content: center;
            background: var(--bg-white);
            border: 1px solid var(--border);
            border-right: none;
            border-radius: 8px 0 0 8px;
            box-shadow: -2px 2px 12px rgba(0, 0, 0, 0.15);
            cursor: pointer;
        }

        #addComponentReopen:hover {
            background: var(--bg-light);
        }

        .acp-reopen-grip {
            width: 8px;
            height: 30px;
            background-image: repeating-linear-gradient(90deg,
                var(--text-light) 0, var(--text-light) 2px,
                transparent 2px, transparent 4px);
            opacity: 0.65;
        }

        .acp-group-label {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-light);
            margin: 0.85rem 0 0.4rem;
        }

        .acp-group {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .acp-group button {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            width: 100%;
            text-align: left;
            padding: 0.5rem 0.6rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-light);
            color: var(--text-dark);
            font-size: 0.88rem;
            font-weight: 500;
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s, color 0.15s;
        }

        .acp-group button:hover {
            border-color: var(--primary);
            background: var(--tint);
            color: var(--primary);
        }

        .acp-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            flex-shrink: 0;
            font-size: 0.9rem;
            font-weight: 700;
        }

        /* The palette floats over the page (draggable + collapsible), so the
           content keeps its normal width in edit mode — no reserved gutter. */

        @media (max-width: 1100px) {
            #addComponentPanel {
                width: 168px;
            }
        }

        /* ---- Per-block edit chrome ---- */
        .block-container.editable {
            position: relative;
            border: 1px dashed var(--border);
            border-radius: 8px;
            padding: 0.75rem 0.85rem;
            margin-bottom: 0.75rem;
            transition: border-color 0.15s;
        }

        /* "+" buttons pinned to a hovered block's top/bottom edge — insert a
           component directly above or below that block. */
        .block-add-btn {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: none;
            background: var(--primary);
            color: #fff;
            font-size: 16px;
            line-height: 1;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.12s;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            z-index: 35;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
        }
        .block-add-btn.above { top: -12px; }
        .block-add-btn.below { bottom: -12px; }
        .block-container.editable:hover .block-add-btn {
            opacity: 1;
            pointer-events: auto;
        }
        .block-add-btn:hover { transform: translateX(-50%) scale(1.15); }
        body.block-dragging .block-add-btn { display: none; }

        /* While dragging a block, reveal the (possibly empty) side column so
           it can receive drops — overrides the inline styles set on render. */
        body.page-editing.block-dragging #pageContentGrid { grid-template-columns: 2fr 1fr !important; }
        body.page-editing.block-dragging #pageSidebar {
            display: flex !important;
            min-height: 120px;
            border: 2px dashed var(--border);
            border-radius: 10px;
        }

        .block-container.editable:hover {
            border-color: var(--primary);
        }

        .block-controls-strip {
            display: flex;
            gap: 0.25rem;
            align-items: center;
            justify-content: flex-end;
            margin-bottom: 0.5rem;
        }

        .block-controls-strip button,
        .block-controls-strip select {
            border: 1px solid var(--border);
            background: var(--bg-white);
            color: var(--text-dark);
            border-radius: 6px;
            padding: 0.2rem 0.5rem;
            font-size: 0.85rem;
            cursor: pointer;
            line-height: 1;
        }

        .block-controls-strip button:hover:not(:disabled) {
            border-color: var(--primary);
            color: var(--primary);
        }

        .block-controls-strip button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .block-container.editable [contenteditable="true"] {
            outline: 1px dashed var(--primary);
            outline-offset: 3px;
            border-radius: 3px;
            min-height: 1.2em;
        }

        .block-container.editable [contenteditable="true"]:focus {
            outline: 2px solid var(--primary);
        }

        .editable-image {
            position: relative;
            display: inline-block;
            max-width: 100%;
        }

        .editable-image img {
            display: block;
            border-radius: 8px;
        }

        .img-resize-handle {
            position: absolute;
            right: -6px;
            bottom: -6px;
            width: 16px;
            height: 16px;
            background: var(--primary);
            border: 2px solid #fff;
            border-radius: 4px;
            cursor: nwse-resize;
            touch-action: none;
        }

        /* ── Image block edit chrome: selection + floating align toolbar ── */
        .editable-image { cursor: pointer; }
        .editable-image.selected img { outline: 3px solid var(--primary); outline-offset: 2px; }
        .img-toolbar {
            position: absolute;
            top: -42px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            gap: 2px;
            background: var(--bg-white);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 3px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.18);
            white-space: nowrap;
            z-index: 40;
        }
        .editable-image.selected .img-toolbar { display: flex; }
        .img-toolbar button {
            border: none;
            background: transparent;
            border-radius: 5px;
            padding: 4px 7px;
            font-size: 0.95rem;
            cursor: pointer;
            color: var(--text-dark);
            line-height: 1;
        }
        .img-toolbar button:hover { background: var(--tint); color: var(--primary); }
        .img-toolbar button.active { background: var(--primary); color: #fff; }
        .img-toolbar .img-tb-divider { width: 1px; background: var(--border); margin: 2px 3px; }

        /* Empty image block: a friendly drop/upload target instead of bare inputs */
        .img-empty-drop {
            border: 2px dashed var(--border);
            border-radius: 10px;
            padding: 1.75rem 1rem;
            text-align: center;
            color: var(--text-light);
            font-size: 0.9rem;
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s;
        }
        .img-empty-drop:hover, .img-empty-drop.drag-over {
            border-color: var(--primary);
            background: var(--tint);
            color: var(--primary);
        }

        /* Wrapped/floated image blocks keep their float while editing (WYSIWYG). */
        .block-container.editable.img-wrap-left,
        .block-container.editable.img-wrap-right { margin-bottom: 0.75rem; }

        /* ── Insert points: a thin line with a + between blocks ── */
        .block-insert-point {
            position: relative;
            height: 14px;
            margin: 2px 0;
            clear: both;
        }
        .block-insert-point::before {
            content: "";
            position: absolute;
            left: 0; right: 0; top: 50%;
            height: 2px;
            background: var(--primary);
            opacity: 0;
            transition: opacity 0.12s;
            border-radius: 1px;
        }
        .block-insert-point .bip-btn {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--bg-white);
            color: var(--text-light);
            font-size: 15px;
            line-height: 1;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.12s, transform 0.12s;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            z-index: 30;
        }
        .block-insert-point:hover::before { opacity: 0.35; }
        .block-insert-point:hover .bip-btn,
        .block-insert-point.menu-open .bip-btn {
            opacity: 1;
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        /* During a block drag, insert points become visible drop targets. */
        body.block-dragging .block-insert-point::before { opacity: 0.25; }
        body.block-dragging .block-insert-point.drop-active { height: 26px; }
        body.block-dragging .block-insert-point.drop-active::before { opacity: 1; height: 4px; }
        body.block-dragging .bip-btn { display: none; }

        /* Compact insert menu opened from a + */
        .bip-menu {
            position: absolute;
            left: 50%;
            top: calc(50% + 14px);
            transform: translateX(-50%);
            background: var(--bg-white);
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: 0 8px 26px rgba(0,0,0,0.2);
            padding: 0.4rem;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.25rem;
            z-index: 60;
            width: 300px;
        }
        .bip-menu button {
            border: 1px solid transparent;
            background: transparent;
            border-radius: 8px;
            padding: 0.45rem 0.25rem;
            font-size: 0.72rem;
            color: var(--text-dark);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.2rem;
        }
        .bip-menu button .bip-ic { font-size: 1.05rem; }
        .bip-menu button:hover { background: var(--tint); border-color: var(--primary); color: var(--primary); }

        /* ── Drag-to-reorder chrome ── */
        .block-drag-handle {
            cursor: grab;
            user-select: none;
            touch-action: none;
            font-size: 0.95rem !important;
            letter-spacing: -1px;
            color: var(--text-light);
        }
        .block-container.editable.drag-source { opacity: 0.35; }
        #blockDragGhost {
            position: fixed;
            pointer-events: none;
            z-index: 100;
            background: var(--bg-white);
            border: 1px solid var(--primary);
            border-radius: 8px;
            padding: 0.4rem 0.8rem;
            font-size: 0.85rem;
            color: var(--primary);
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
            max-width: 260px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        @media (max-width: 900px) {
            .reader-layout-container {
                grid-template-columns: 1fr;
            }
            /* Chapters list becomes an off-canvas drawer (app-style) */
            .modern-sidebar {
                position: fixed;
                left: 0;
                top: 0;
                bottom: 0;
                height: 100vh;
                width: min(82vw, 320px);
                transform: translateX(-100%);
                transition: transform 0.25s ease;
                z-index: 2000;
                background: var(--bg-white);
                box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            }
            .modern-sidebar.open {
                transform: translateX(0);
            }
            .modern-sidebar .sidebar-resize-handle,
            .modern-sidebar .sidebar-collapse-toggle {
                display: none;
            }
            #closeSidebarBtn {
                display: block !important;
            }
        }
    </style>
</head>

    <script>
        const bookFolder = "{{ book_folder }}";
        const pageId = "{{ page_id }}";
        let allPages = [];
        let currentPageIndex = -1;
        let currentPageData = null;

        // When copying text, strip background colours from the clipboard HTML so
        // pasting into another app doesn't carry a white/cream highlight behind
        // the text. Keeps the text and its formatting (bold, italics, etc.).
        document.addEventListener('copy', (e) => {
            const selection = window.getSelection();
            if (!selection || selection.rangeCount === 0 || selection.isCollapsed) return;

            const wrapper = document.createElement('div');
            for (let i = 0; i < selection.rangeCount; i++) {
                wrapper.appendChild(selection.getRangeAt(i).cloneContents());
            }

            // Neutralise any background on the copied nodes (inline styles win in
            // the destination app). Also drop code-block syntax-highlight colours.
            wrapper.querySelectorAll('*').forEach((el) => {
                el.style.background = 'transparent';
                el.style.backgroundColor = 'transparent';
                if (el.tagName === 'PRE' || el.tagName === 'CODE') {
                    el.style.color = 'inherit';
                }
            });

            e.clipboardData.setData('text/html', wrapper.innerHTML);
            e.clipboardData.setData('text/plain', selection.toString());
            e.preventDefault();
        });

        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.dataset.theme = savedTheme;
            updateThemeToggle();
        }

        // Apply admin-configured heading styles (font size/colour/family) saved from
        // the editor's ⚙️ H-Styles dialog, so headings match the editor here too.
        async function applyHeadingStyles() {
            try {
                const response = await fetch('/api/heading-styles');
                if (!response.ok) return;
                const styles = await response.json();
                for (let i = 1; i <= 6; i++) {
                    const level = `h${i}`;
                    const style = styles[level];
                    if (!style) continue;

                    const existing = document.getElementById(`heading-style-${level}`);
                    if (existing) existing.remove();

                    const styleEl = document.createElement('style');
                    styleEl.id = `heading-style-${level}`;
                    // Scoped to the content body: an unscoped `h2 { ... !important }`
                    // also captures the sticky titlebar's h2 and pins its font-size.
                    styleEl.textContent = `
                        .page-body ${level} {
                            font-size: ${style.fontSize} !important;
                            color: ${style.color} !important;
                            font-family: ${style.fontFamily} !important;
                        }
                    `;
                    document.head.appendChild(styleEl);
                }
            } catch (e) {
                console.warn('Failed to load heading styles:', e);
            }
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.dataset.theme || 'light';
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.dataset.theme = newTheme;
            localStorage.setItem('theme', newTheme);
            updateThemeToggle();
        }

        function updateThemeToggle() {
            const isDark = document.documentElement.dataset.theme === 'dark';
            const toggleBtn = document.getElementById('themeToggleFooter');
            if (toggleBtn) {
                toggleBtn.querySelector('.theme-icon').textContent = isDark ? '☀️' : '🌙';
            }
            const headerBtn = document.getElementById('themeToggleHeader');
            if (headerBtn) {
                headerBtn.querySelector('.theme-icon-moon').style.display = isDark ? 'none' : 'flex';
                headerBtn.querySelector('.theme-icon-sun').style.display = isDark ? 'flex' : 'none';
            }
        }

        // Completion state is tracked server-side (ReadingActivity), seeded from the view render
        let pageCompleted = {{ 'true' if initial_completed else 'false' }};
        const completedPageIds = {{ completed_page_ids | tojson }};

        function isPageComplete(pid) {
            if (pid === undefined || pid === pageId) return pageCompleted;
            return completedPageIds.includes(pid);
        }

        function toggleComplete() {
            const next = !pageCompleted;
            pageCompleted = next;
            updateCompleteButton();
            if (window.__reportComplete) {
                window.__reportComplete(next);
            }
        }

        /* Drawn checkmark rather than the ✔ / ✓ glyphs that were here — those render
           in whatever the platform's fallback font is, so their weight and size did
           not match any other icon on the page. */
        const ICON_CHECK =
            `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="20 6 9 17 4 12"/>
             </svg>`;

        function completeBtnContent(done) {
            return ICON_CHECK + `<span>${done ? 'Completed' : 'Mark as complete'}</span>`;
        }

        function updateCompleteButton() {
            const btn = document.getElementById('completeBtn');
            btn.innerHTML = completeBtnContent(pageCompleted);
            /* "tap to undo" was baked into the label, which made the button name
               change length on every toggle and read oddly on a desktop mouse. The
               reversibility is a hint, not part of the action's name. */
            btn.title = pageCompleted ? 'Mark this page as not complete' : 'Mark this page as complete';
            btn.setAttribute('aria-pressed', pageCompleted ? 'true' : 'false');
            btn.className = `complete-btn ${pageCompleted ? 'complete' : 'incomplete'}`;
        }

        async function loadPages() {
            try {
                const response = await fetch(`/api/book/${bookFolder}/pages`);
                const data = await response.json();
                allPages = data.pages || [];
                currentPageIndex = allPages.findIndex(p => p.id === pageId);
                
                // Populate Left Navigation Sidebar Menu with hierarchy styling
                const menu = document.getElementById('sidebarMenu');
                if (menu) {
                    // Build navigation tree with hierarchy levels. Sections are real
                    // collapsible groups now — one <button> header per top-level topic,
                    // wrapping a .nav-section-group of its pages.
                    const chevronIcon = '<svg class="nav-section-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>';
                    const genericIcon = '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>';

                    // IB DP Computer Science syllabus topics — used only when a section's
                    // code matches this exact standard curriculum. Anything else (a
                    // different book, a differently-coded syllabus) falls back to the
                    // bare code and a generic icon, so this never breaks on other books.
                    const SECTION_META = {
                        A1: { title: 'Computer Fundamentals', icon: '<rect x="6" y="6" width="12" height="12" rx="2"></rect><path d="M6 3v3M12 3v3M18 3v3M6 18v3M12 18v3M18 18v3M3 6h3M3 12h3M3 18h3M18 6h3M18 12h3M18 18h3"></path>' },
                        A2: { title: 'Networking', icon: '<circle cx="6" cy="6" r="2.5"></circle><circle cx="18" cy="6" r="2.5"></circle><circle cx="12" cy="18" r="2.5"></circle><path d="M8 7.5 10.5 15.5M16 7.5 13.5 15.5M8.5 6h7"></path>' },
                        A3: { title: 'Databases', icon: '<ellipse cx="12" cy="6" rx="7" ry="3"></ellipse><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6"></path><path d="M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"></path>' },
                        A4: { title: 'Machine Learning', icon: '<rect x="5" y="9" width="14" height="10" rx="2"></rect><circle cx="9" cy="14" r="1.3"></circle><circle cx="15" cy="14" r="1.3"></circle><path d="M12 9V5M9 5h6"></path>' },
                        B1: { title: 'Approaches to Computational Thinking', icon: '<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3 11.2c.4.3.6.7.6 1.1V16h4.8v-.7c0-.4.2-.8.6-1.1A6 6 0 0 0 12 3z"></path>' },
                        B2: { title: 'Programming', icon: '<polyline points="8 8 4 12 8 16"></polyline><polyline points="16 8 20 12 16 16"></polyline>' },
                        B3: { title: 'Object-Oriented Programming', icon: '<path d="M12 3 4 7.5v9L12 21l8-4.5v-9L12 3z"></path><path d="M4 7.5 12 12l8-4.5M12 12v9"></path>' },
                        B4: { title: 'Abstract Data Types', icon: '<polygon points="12 3 21 8 12 13 3 8"></polygon><polyline points="3 13 12 18 21 13"></polyline>' },
                    };

                    function sectionMeta(code) {
                        return SECTION_META[code] || { title: '', icon: genericIcon };
                    }

                    function sectionLabel(code) {
                        const meta = sectionMeta(code);
                        return meta.title ? `${code}: ${meta.title}` : code;
                    }

                    let navHtml = '<nav class="navigation-tree">';
                    let currentTopLevelSection = null;
                    let currentThemeLetter = null;
                    let sectionOpen = false;

                    allPages.forEach((page, idx) => {
                        const isActive = page.id === pageId;
                        const isDone = isPageComplete(page.id);

                        // Extract hierarchy level from topic number
                        let hierarchyLevel = 4;
                        let topicNumber = '';
                        let topLevelSection = '';

                        if (page.title.includes('Introduction')) {
                            hierarchyLevel = 0;
                            topLevelSection = 'INTRODUCTION';
                        } else {
                            // Extract topic number (e.g., "A1.1.1 Description..." → "A1.1.1")
                            const match = page.title.match(/^([A-Z]?\d+(?:\.\d+)*)/);
                            if (match) {
                                topicNumber = match[1];
                                const dotCount = (topicNumber.match(/\./g) || []).length;
                                hierarchyLevel = 2 + dotCount;

                                // Top-level section: keep the theme letter (A1, B1, ...) —
                                // stripping it previously merged unrelated themes that share
                                // a number (A1 and B1 both became "PART 1").
                                const topMatch = topicNumber.match(/^([A-Z]?\d+)/);
                                if (topMatch) {
                                    topLevelSection = topMatch[1];
                                }
                            }
                        }

                        // Add a new collapsible section when we've moved to a new top-level
                        // topic. The Introduction page has no visible row (hierarchy level 0
                        // is display:none), so it gets no header either — nothing to collapse.
                        if (topLevelSection && topLevelSection !== currentTopLevelSection && hierarchyLevel !== 0) {
                            // A leading letter groups sections into a "Theme" super-label
                            // (Theme A, Theme B, ...) — plain text, not itself collapsible,
                            // same as the reference tree's two-tier grouping.
                            const themeLetterMatch = topLevelSection.match(/^([A-Z])/);
                            const themeLetter = themeLetterMatch ? themeLetterMatch[1] : null;
                            if (themeLetter && themeLetter !== currentThemeLetter) {
                                if (sectionOpen) { navHtml += '</div>'; sectionOpen = false; }
                                navHtml += `<div class="nav-theme-label">Theme ${themeLetter}</div>`;
                                currentThemeLetter = themeLetter;
                            }

                            if (sectionOpen) navHtml += '</div>';
                            const sectionId = 'sec-' + topLevelSection.replace(/[^a-zA-Z0-9]/g, '');
                            const meta = sectionMeta(topLevelSection);
                            navHtml += `
                                <button type="button" class="nav-section-header" data-section-target="${sectionId}">
                                    <svg class="nav-section-header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${meta.icon}</svg>
                                    <span class="nav-section-header-label">${sectionLabel(topLevelSection)}</span>
                                    ${chevronIcon}
                                </button>
                                <div class="nav-section-group" data-section="${sectionId}">
                            `;
                            currentTopLevelSection = topLevelSection;
                            sectionOpen = true;
                        }

                        navHtml += `
                            <div class="nav-item" data-hierarchy-level="${hierarchyLevel}" ${topicNumber ? `data-topic-number="${topicNumber}"` : ''}>
                                <a href="/book/${bookFolder}/page/${page.id}" ${isActive ? 'class="active" aria-current="page"' : ''} title="${page.title}">
                                    <span style="flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${page.title}</span>
                                    ${isDone ? '<span class="completion-indicator">✓</span>' : ''}
                                </a>
                            </div>
                        `;
                    });

                    if (sectionOpen) navHtml += '</div>';

                    navHtml += '</nav>';
                    menu.innerHTML = navHtml;

                    // Collapse every section except the one containing the current page —
                    // with 100+ pages in a book, showing every chapter open at once is the
                    // exact "too much at once" this tree is meant to avoid.
                    menu.querySelectorAll('.nav-section-group').forEach(group => {
                        if (!group.querySelector('a.active')) {
                            group.classList.add('collapsed');
                            const header = menu.querySelector(`[data-section-target="${group.dataset.section}"]`);
                            if (header) header.classList.add('collapsed');
                        }
                    });

                    initNavSectionToggles(menu);
                }

                loadPage();
            } catch (error) {
                console.error('Failed to load pages:', error);
            }
        }

        function initNavSectionToggles(menu) {
            if (menu.dataset.navTogglesWired) return;
            menu.dataset.navTogglesWired = '1';

            menu.addEventListener('click', (e) => {
                const header = e.target.closest('.nav-section-header');
                if (!header) return;
                const group = menu.querySelector(`.nav-section-group[data-section="${header.dataset.sectionTarget}"]`);
                if (!group) return;
                const collapsed = group.classList.toggle('collapsed');
                header.classList.toggle('collapsed', collapsed);
            });

            const expandAllBtn = document.getElementById('expandAllNav');
            const collapseAllBtn = document.getElementById('collapseAllNav');
            if (expandAllBtn) {
                expandAllBtn.addEventListener('click', () => {
                    menu.querySelectorAll('.nav-section-group').forEach(g => g.classList.remove('collapsed'));
                    menu.querySelectorAll('.nav-section-header').forEach(h => h.classList.remove('collapsed'));
                });
            }
            if (collapseAllBtn) {
                collapseAllBtn.addEventListener('click', () => {
                    menu.querySelectorAll('.nav-section-group').forEach(g => g.classList.add('collapsed'));
                    menu.querySelectorAll('.nav-section-header').forEach(h => h.classList.add('collapsed'));
                });
            }
        }

        async function loadPage() {
            try {
                const isReadingMode = document.body.classList.contains('reading-mode');

                if (isReadingMode) {
                    // In reading mode, load all pages for continuous scroll
                    await loadAllPagesForReading();
                } else {
                    // Normal mode: load single page
                    const response = await fetch(`/api/book/${bookFolder}/page/${pageId}`);
                    const data = await response.json();

                    if (data.error) {
                        document.getElementById('pageBody').innerHTML = `<p style="color: var(--danger);">${data.error}</p>`;
                        return;
                    }

                    currentPageData = data;

                    document.title = data.title;
                    document.getElementById('pageTitle').textContent = data.title;
                    setPageTitlebar(data);

                    renderContent(data);
                    updateCompleteButton();
                    // This can resolve before DOMContentLoaded, so make sure the
                    // scale exists before trying to mark a step on it.
                    buildConfidenceScale();
                    loadConfidenceRating();
                    updateQuizButton();
                    renderPager();
                    updateEditNavButtons();
                    maybeResumePageEdit();
                }
            } catch (error) {
                console.error('Failed to load page:', error);
                document.getElementById('pageBody').innerHTML = `<p style="color: var(--danger);">Error: ${error.message}</p>`;
            }
        }

        // Show the "Take the quiz" button (normal mode) only when the section has questions
        async function updateQuizButton() {
            const btn = document.getElementById('takeQuizBtn');
            if (!btn) return;
            try {
                const res = await fetch(`/api/quiz/${encodeURIComponent(bookFolder)}/${encodeURIComponent(pageId)}/questions`);
                const data = await res.json();
                /* inline-flex, not inline-block — the button now carries an icon
                   beside its label and needs the flex box to align them. */
                btn.style.display = (data.questions || []).length ? 'inline-flex' : 'none';
            } catch (e) { /* leave hidden */ }
        }

        // Fetch a single page's data, returning { error } instead of throwing so one
        // failed page can't abort the whole reading-mode render.
        async function fetchReadingPage(page) {
            try {
                const response = await fetch(`/api/book/${bookFolder}/page/${page.id}`);
                return await response.json();
            } catch (e) {
                return { error: e.message };
            }
        }

        // Build the continuous-reader <section> for one page. Returns null on error.
        function buildReadingSection(page, data, isLast) {
            if (!data || data.error) return null;

            // Create section for this page
            const section = document.createElement('section');
            section.className = 'reading-section';
            section.setAttribute('data-page-id', page.id);
            section.setAttribute('data-page-title', page.title);
            section.style.paddingBottom = '3rem';
            section.style.marginBottom = '2rem';
            if (!isLast) {
                section.style.borderBottom = '2px solid #d4cfc4';
            }

            // Add section title
            const titleEl = document.createElement('h2');
            titleEl.className = 'page-title';
            titleEl.textContent = page.title;
            titleEl.style.marginTop = '0';
            section.appendChild(titleEl);

            // Create content container
            const contentDiv = document.createElement('div');
            contentDiv.style.lineHeight = '1.8';
            contentDiv.style.color = 'var(--text-dark)';

            // Vocabulary is collected while rendering and shown as an accordion
            // at the end of the page rather than inline.
            const vocabBlocks = [];

            // Render blocks
            if (data.blocks && data.blocks.length > 0) {
                data.blocks.forEach(block => {
                    const blockDiv = document.createElement('div');
                    switch (block.type) {
                        case 'heading':
                            const lvl = block.level || 2;
                            blockDiv.innerHTML = `<h${lvl} style="color: var(--text-dark); font-weight: 600; letter-spacing: -0.01em; margin: 2.25rem 0 0.75rem 0;">${block.text}</h${lvl}>`;
                            contentDiv.appendChild(blockDiv);
                            break;
                        case 'text':
                            blockDiv.innerHTML = `<div style="line-height: 1.8; margin-bottom: 1rem;">${textBlockToHtml(block.text)}</div>`;
                            contentDiv.appendChild(blockDiv);
                            break;
                        case 'sidebox':
                            if (block.style === 'vocab') {
                                vocabBlocks.push(block);
                            }
                            break;
                        case 'question':
                            const uniqueId = 'ans-' + Math.random().toString(36).substr(2, 9);
                            blockDiv.className = 'question-block';
                            blockDiv.style.cssText = 'margin-bottom: 1.5rem; padding: 1rem; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-light);';
                            blockDiv.innerHTML = `
                                <div style="font-weight: bold; margin-bottom: 0.5rem; color: var(--primary);">❓ Question</div>
                                <div style="font-size: 1.05rem; margin-bottom: 0.75rem;">${block.text}</div>
                                <button class="btn btn-small" onclick="const a = document.getElementById('${uniqueId}'); a.style.display = a.style.display === 'none' ? 'block' : 'none'; this.textContent = a.style.display === 'block' ? '🙈 Hide Markscheme' : '👁️ Show Markscheme';" style="font-size: 0.85rem; padding: 4px 8px; cursor: pointer; background: var(--primary); color: white; border: none; border-radius: 4px;">
                                    👁️ Show Markscheme
                                </button>
                                <div id="${uniqueId}" style="display: none; margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px dashed var(--border); color: #059669; font-weight: 500;">
                                    <div style="font-size: 0.85rem; text-transform: uppercase; color: #059669; margin-bottom: 0.25rem; font-weight: bold;">✓ Markscheme</div>
                                    <div>${block.answer || 'No mark scheme available.'}</div>
                                </div>
                            `;
                            contentDiv.appendChild(blockDiv);
                            break;
                        case 'guiding':
                            blockDiv.className = 'guiding-panel';
                            blockDiv.innerHTML = buildGuidingPanelHTML(block);
                            contentDiv.appendChild(blockDiv);
                            break;
                        case 'code':
                            const codeLang = block.language || 'python';
                            const rawCode = block.code || '';
                            const codeContainer = document.createElement('div');
                            codeContainer.style.cssText = 'background: #1e1e1e; border-radius: 8px; overflow: hidden; margin: 1.5rem 0; box-shadow: var(--shadow);';

                            const header = document.createElement('div');
                            header.style.cssText = 'background: #2d2d30; padding: 0.75rem 1rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #3e3e42;';
                            header.innerHTML = '<span style="font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: #858585; font-weight: 600;">Code: ' + codeLang + '</span>';
                            codeContainer.appendChild(header);

                            if (block.title) {
                                const titleDiv = document.createElement('div');
                                titleDiv.style.cssText = 'padding: 0.75rem 1rem; font-size: 0.85rem; font-weight: 600; color: #d4d4d4;';
                                titleDiv.textContent = block.title;
                                codeContainer.appendChild(titleDiv);
                            }

                            const pre = document.createElement('pre');
                            pre.style.cssText = "margin: 0; padding: 1rem; overflow-x: auto; font-family: var(--code-font); font-size: 0.9rem; line-height: 1.5; background: #1e1e1e;";
                            const code = document.createElement('code');
                            code.className = 'language-' + codeLang;
                            code.style.cssText = 'color: #d4d4d4;';
                            code.textContent = rawCode;
                            pre.appendChild(code);
                            codeContainer.appendChild(pre);
                            contentDiv.appendChild(codeContainer);

                            setTimeout(() => {
                                if (window.hljs) hljs.highlightElement(code);
                            }, 0);
                            break;
                    }
                });
            }

            section.appendChild(contentDiv);

            // Vocabulary accordion at the bottom of the page
            if (vocabBlocks.length > 0) {
                const details = document.createElement('details');
                details.className = 'vocab-accordion';
                const inner = vocabBlocks.map(b => `
                    ${vocabBlocks.length > 1 ? `<h5>${b.title || 'Vocabulary'}</h5>` : ''}
                    <div style="font-size: 0.95rem;">${textBlockToHtml(b.text)}</div>
                `).join('');
                details.innerHTML = `
                    <summary>📖 Vocabulary</summary>
                    <div class="vocab-accordion-body">${inner}</div>
                `;
                section.appendChild(details);
            }

            // Add complete button and confidence widget at end of each page
            const pageFooter = document.createElement('div');
            pageFooter.style.cssText = 'display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid #d4cfc4;';

            /* Reading mode repeats this footer under every section, so it is the same
               component as the action bar at the bottom of normal mode. It was drifting
               separately — emoji faces, 999px pills, its own inline copies of styles
               that already exist as classes, and a label ("How did you feel with
               section") that was cut off mid-sentence. It shares the classes and the
               step definitions now, so the two can't diverge again. */
            const labelId = `confLabel-${page.id}`;
            const confidenceLabel = document.createElement('span');
            confidenceLabel.className = 'confidence__label';
            confidenceLabel.id = labelId;
            confidenceLabel.textContent = 'How confident are you?';

            const confidenceDiv = document.createElement('div');
            confidenceDiv.className = 'confidence__scale';
            confidenceDiv.setAttribute('role', 'radiogroup');
            confidenceDiv.setAttribute('aria-labelledby', labelId);
            CONFIDENCE_STEPS.forEach(step => {
                const btn = document.createElement('button');
                btn.className = 'confidence-btn';
                btn.type = 'button';
                btn.setAttribute('role', 'radio');
                btn.setAttribute('aria-checked', 'false');
                btn.setAttribute('aria-label', step.label);
                btn.tabIndex = step.level === 1 ? 0 : -1;
                btn.innerHTML = confidenceFaceSVG(step.mouth);
                btn.dataset.level = step.level;
                btn.dataset.pageId = page.id;
                btn.onclick = () => savePageConfidenceRating(page.id, step.level, btn);
                confidenceDiv.appendChild(btn);
            });
            confidenceDiv.addEventListener('keydown', confidenceKeys);

            const confidenceWrapper = document.createElement('div');
            confidenceWrapper.className = 'confidence';
            confidenceWrapper.appendChild(confidenceLabel);
            confidenceWrapper.appendChild(confidenceDiv);

            const completeBtn = document.createElement('button');
            completeBtn.className = 'complete-btn incomplete';
            completeBtn.type = 'button';
            completeBtn.setAttribute('aria-pressed', 'false');
            completeBtn.innerHTML = completeBtnContent(false);
            completeBtn.onclick = () => togglePageComplete(page.id, completeBtn);

            const footerActions = document.createElement('div');
            footerActions.className = 'page-actions__group';
            if (!window.__isAdmin__ && (readingQuizCounts[page.id] || 0) > 0) {
                const quizLink = document.createElement('a');
                quizLink.href = `/book/${bookFolder}/quiz/${page.id}`;
                quizLink.className = 'page-action-secondary';
                quizLink.innerHTML =
                    `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/>
                        <path d="M14 2v6h6"/><path d="M9 13h4"/><path d="M9 17h6"/>
                     </svg><span>Take the quiz</span>`;
                footerActions.appendChild(quizLink);
            }
            footerActions.appendChild(completeBtn);

            pageFooter.appendChild(footerActions);
            pageFooter.appendChild(confidenceWrapper);
            section.appendChild(pageFooter);

            return section;
        }

        // Question count per page, so reading mode knows where to offer quizzes
        let readingQuizCounts = {};

        async function loadAllPagesForReading() {
            try {
                const body = document.getElementById('pageBody');
                body.innerHTML = '';
                const mainArea = document.querySelector('.reader-main-area');

                if (allPages.length === 0) return;

                try {
                    const res = await fetch(`/api/quiz/${encodeURIComponent(bookFolder)}/counts`);
                    if (res.ok) readingQuizCounts = (await res.json()).counts || {};
                } catch (e) { /* quiz buttons are optional */ }

                const lastIdx = allPages.length - 1;
                const foundIdx = allPages.findIndex(p => p.id === pageId);
                const anchorIdx = foundIdx >= 0 ? foundIdx : 0;

                // Phase 1: load and render ONLY the page the user is on, first, so
                // reading mode opens immediately showing their current page in full
                // rather than waiting for the whole book to download.
                const anchorPage = allPages[anchorIdx];
                const anchorData = await fetchReadingPage(anchorPage);
                const anchorSection = buildReadingSection(anchorPage, anchorData, anchorIdx === lastIdx);
                if (anchorSection) body.appendChild(anchorSection);

                setupReadingModeScrollListener();
                updateReadingModeHeader();

                // Phase 2: load the rest of the book in parallel and slot each page
                // around the anchor. Pages after the anchor are appended below (no
                // visual shift). Pages before it are prepended above, with a scrollTop
                // correction so the user's current page stays put on screen.
                if (mainArea) mainArea.style.overflowAnchor = 'none';

                const rest = await Promise.all(allPages.map((page, idx) =>
                    idx === anchorIdx
                        ? Promise.resolve(null)
                        : fetchReadingPage(page).then(data => ({ page, data, idx }))
                ));

                // Append pages that come after the current one, in order
                for (let idx = anchorIdx + 1; idx <= lastIdx; idx++) {
                    const entry = rest[idx];
                    const section = entry && buildReadingSection(entry.page, entry.data, idx === lastIdx);
                    if (section) body.appendChild(section);
                }

                // Prepend pages that come before the current one, keeping the anchor in view
                for (let idx = anchorIdx - 1; idx >= 0; idx--) {
                    const entry = rest[idx];
                    const section = entry && buildReadingSection(entry.page, entry.data, false);
                    if (!section) continue;
                    const heightBefore = mainArea ? mainArea.scrollHeight : 0;
                    body.insertBefore(section, body.firstChild);
                    if (mainArea) {
                        mainArea.scrollTop += (mainArea.scrollHeight - heightBefore);
                    }
                }

                updateReadingModeHeader();
            } catch (error) {
                console.error('Failed to load pages for reading:', error);
            }
        }

        function renderContentInto(data, targetBody, sidebarId) {
            targetBody.innerHTML = '';
            const sidebar = document.createElement('div');
            sidebar.id = sidebarId;
            targetBody.parentElement.appendChild(sidebar);

            let hasSidebarContent = false;

            if (data.blocks && data.blocks.length > 0) {
                data.blocks.forEach(block => {
                    const div = document.createElement('div');
                    switch (block.type) {
                        case 'heading':
                            const lvl = block.level || 2;
                            div.innerHTML = `<h${lvl} style="color: var(--text-dark); font-weight: 600; letter-spacing: -0.01em; margin: 2.25rem 0 0.75rem 0;">${block.text}</h${lvl}>`;
                            targetBody.appendChild(div);
                            break;
                        case 'text':
                            div.innerHTML = `<div style="line-height: 1.8; color: var(--text-dark); margin-bottom: 1rem;">${textBlockToHtml(block.text)}</div>`;
                            targetBody.appendChild(div);
                            break;
                        case 'sidebox':

                            div.innerHTML = `
                                <div class="sidebar-section ${style}">
                                    <h4 style="margin: 0 0 0.5rem 0; font-size: 1.1rem; font-weight: bold;">${block.title || 'Note'}</h4>
                                    <div style="line-height: 1.6; font-size: 0.95rem;">${textBlockToHtml(block.text)}</div>

                            break;

                                div.style.width = block.width || '45%';
                                div.style.maxWidth = '70%';
                                div.style.margin = block.align === 'left'
                                    ? '0.25rem 1.5rem 0.75rem 0' : '0.25rem 0 0.75rem 1.5rem';
                            }
                            div.innerHTML = `
                                <img src="${block.src}" alt="${block.alt || 'Image'}" style="max-width: 100%; ${(block.align === 'left' || block.align === 'right' || block.align === 'full') ? 'width: 100%;' : ''} border-radius: 8px; box-shadow: var(--shadow);" onerror="this.src='/static/images/placeholder.png'" />
                                ${block.caption ? `<div style="font-size: 0.85rem; color: var(--text-light); text-align: center; margin-top: 4px;">${block.caption}</div>` : ''}
                            `;
                            if (!block.side) targetBody.appendChild(div);

                        case 'question':

                            div.className = 'question-block';

                            div.style.padding = '1rem';
                            div.style.border = '1px solid var(--border)';
                            div.style.borderRadius = '8px';
                            div.style.background = 'var(--bg-light)';
                            div.innerHTML = `
                                <div style="font-weight: bold; margin-bottom: 0.5rem; color: var(--primary);">❓ Question</div>
                                <div style="font-size: 1.05rem; margin-bottom: 0.75rem;">${block.text}</div>
                                <button class="btn btn-small" onclick="const a = document.getElementById('${uniqueId}'); a.style.display = a.style.display === 'none' ? 'block' : 'none'; this.textContent = a.style.display === 'block' ? '🙈 Hide Markscheme' : '👁️ Show Markscheme';" style="font-size: 0.85rem; padding: 4px 8px; cursor: pointer; background: var(--primary); color: white; border: none; border-radius: 4px;">
                                    👁️ Show Markscheme
                                </button>
                                <div id="${uniqueId}" style="display: none; margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px dashed var(--border); color: #059669; font-weight: 500;">
                                    <div style="font-size: 0.85rem; text-transform: uppercase; color: #059669; margin-bottom: 0.25rem; font-weight: bold;">✓ Markscheme</div>
                                    <div>${block.answer || 'No mark scheme available.'}</div>

                            header.style.cssText = 'background: #2d2d30; padding: 0.75rem 1rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #3e3e42;';
                            const langLabel = document.createElement('div');
                            langLabel.style.cssText = 'display: flex; align-items: center; gap: 0.5rem;';
                            langLabel.innerHTML = '<span style="font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: #858585; font-weight: 600;">Code</span><span style="font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: #6a9955;">' + codeLang + '</span>';
                            header.appendChild(langLabel);
                            codeContainer.appendChild(header);

                            if (block.title) {
                                const titleDiv = document.createElement('div');
                                titleDiv.style.cssText = 'padding: 0.75rem 1rem; font-size: 0.85rem; font-weight: 600; color: #d4d4d4;';
                                titleDiv.textContent = block.title;
                                codeContainer.appendChild(titleDiv);
                            }

                            const pre = document.createElement('pre');
                            pre.style.cssText = "margin: 0; padding: 1rem; overflow-x: auto; font-family: var(--code-font); font-size: 0.9rem; line-height: 1.5; background: #1e1e1e;";
                            const code = document.createElement('code');
                            code.className = 'language-' + codeLang;
                            code.style.cssText = 'color: #d4d4d4;';
                            code.textContent = rawCode;
                            pre.appendChild(code);
                            codeContainer.appendChild(pre);
                            targetBody.appendChild(codeContainer);

                            setTimeout(() => {
                                if (window.hljs) hljs.highlightElement(code);
                            }, 0);

                    }
                });
