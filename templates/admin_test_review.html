{% extends "admin_base.html" %}
{% block title %}Test Review{% endblock %}

{% block content %}
<style>
    .qr-container { max-width: 1000px; margin: 0 auto; }
    .qr-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem; }
    .qr-header h1 { font-size: 1.5rem; margin: 0; }
    .qr-controls { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
    .qr-controls select { padding: 0.45rem 0.7rem; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-white); color: var(--text-dark); }

    .qr-card {
        background: var(--bg-white);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1.25rem;
        margin-bottom: 1rem;
    }
    .qr-meta { display: flex; gap: 0.75rem; flex-wrap: wrap; font-size: 0.8rem; color: var(--text-light); margin-bottom: 0.6rem; align-items: center; }
    .qr-pill { padding: 0.15rem 0.6rem; border-radius: 999px; font-weight: 700; font-size: 0.75rem; }
    .qr-pill.high-conf { background: rgba(16,185,129,0.15); color: #10b981; }
    .qr-pill.mid-conf { background: rgba(217,119,6,0.15); color: #d97706; }
    .qr-pill.low-conf { background: rgba(239,68,68,0.12); color: #ef4444; }
    .qr-pill.no-ai { background: rgba(199,125,255,0.15); color: var(--primary); }
    .qr-pill.done { background: rgba(16,185,129,0.15); color: #10b981; }
    .qr-question { font-weight: 600; margin-bottom: 0.5rem; }
    .qr-answer { background: var(--bg-light); border-radius: 6px; padding: 0.7rem 0.9rem; margin-bottom: 0.5rem; white-space: pre-wrap; }
    .qr-ms { font-size: 0.85rem; color: #059669; margin-bottom: 0.35rem; }
    .qr-note { font-size: 0.82rem; color: var(--text-light); font-style: italic; margin-bottom: 0.6rem; }
    .qr-actions { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    .qr-actions input[type=number] {
        width: 70px; padding: 0.4rem 0.5rem; border: 1px solid var(--border); border-radius: 6px;
        background: var(--bg-white); color: var(--text-dark); font-family: inherit;
    }
    .qr-actions button { padding: 0.45rem 1rem; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85rem; background: var(--bg-light); color: var(--text-dark); }
    .qr-actions button.award { border-color: #10b981; color: #10b981; }
    .qr-actions button:hover { filter: brightness(0.95); }
    .qr-empty { text-align: center; padding: 3rem; color: var(--text-light); }
</style>

<div class="qr-container">
    <div class="qr-header">
        <h1>📝 Test answer review queue</h1>
        <div class="qr-controls">
            <select id="classFilter" onchange="onClassChange()"><option value="">All classes</option></select>
            <select id="studentFilter" onchange="loadAnswers()"><option value="">All students</option></select>
            <select id="statusFilter" onchange="loadAnswers()">
                <option value="pending">Needs review</option>
                <option value="reviewed">Reviewed</option>
                <option value="all">All</option>
            </select>
        </div>
    </div>
    <div id="qrList"><div class="qr-empty">Loading…</div></div>
</div>

<script>
function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s || '';
    return d.innerHTML;
}

function confidencePill(a) {
    if (a.status === 'reviewed' && a.confidence === null) {
        return '<span class="qr-pill done">✓ teacher-marked</span>';
    }
    if (a.confidence === null) return '<span class="qr-pill no-ai">no AI mark — needs manual review</span>';
    if (a.confidence >= 0.90) return `<span class="qr-pill high-conf">confidence ${Math.round(a.confidence * 100)}%</span>`;
    if (a.confidence >= 0.70) return `<span class="qr-pill mid-conf">confidence ${Math.round(a.confidence * 100)}%</span>`;
    return `<span class="qr-pill low-conf">low confidence ${Math.round(a.confidence * 100)}% — priority</span>`;
}

async function loadClassFilter() {
    const res = await fetch('/admin/api/classes');
    const classes = await res.json();
    const sel = document.getElementById('classFilter');
    classes.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.id;
        opt.textContent = c.name;
        sel.appendChild(opt);
    });
    await loadStudentFilter();
}

async function loadStudentFilter() {
    const classId = document.getElementById('classFilter').value;
    const res = await fetch('/admin/api/students' + (classId ? `?class_id=${classId}` : ''));
    const students = await res.json();
    const sel = document.getElementById('studentFilter');
    sel.innerHTML = '<option value="">All students</option>';
    students.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.id;
        opt.textContent = s.name;
        sel.appendChild(opt);
    });
}

async function onClassChange() {
    await loadStudentFilter();  // narrows the student list; selection resets to All
    loadAnswers();
}

async function loadAnswers() {
    const status = document.getElementById('statusFilter').value;
    const classId = document.getElementById('classFilter').value;
    const studentId = document.getElementById('studentFilter').value;
    const list = document.getElementById('qrList');
    list.innerHTML = '<div class="qr-empty">Loading…</div>';
    const params = new URLSearchParams({ status });
    if (studentId) params.set('student_id', studentId);
    else if (classId) params.set('class_id', classId);
    const res = await fetch(`/admin/api/test-review?${params}`);
    const data = await res.json();
    const answers = data.answers || [];

    if (!answers.length) {
        list.innerHTML = '<div class="qr-empty">Nothing here — all caught up. 🎉</div>';
        return;
    }
    list.innerHTML = '';
    answers.forEach(a => {
        const div = document.createElement('div');
        div.className = 'qr-card';
        div.innerHTML = `
            <div class="qr-meta">
                <strong>${escapeHtml(a.student)}</strong>
                <span>📄 ${escapeHtml(a.paper_title)}</span>
                <span>${escapeHtml(a.subtopic_title)}</span>
                <span style="font-weight: 700;">${a.marks} mark${a.marks !== 1 ? 's' : ''}</span>
                <span>${a.submitted_at}</span>
                ${confidencePill(a)}
            </div>
            <div class="qr-question">${escapeHtml(a.question)}</div>
            <div class="qr-answer">${escapeHtml(a.answer_text) || '<em>No answer provided.</em>'}</div>
            ${a.marking_guidance ? `<div class="qr-ms">✓ Marking guidance: ${escapeHtml(a.marking_guidance)}</div>` : ''}
            ${a.common_mistakes ? `<div class="qr-note">Common mistakes: ${escapeHtml(a.common_mistakes)}</div>` : ''}
            ${a.ai_feedback ? `<div class="qr-note">AI note: ${escapeHtml(a.ai_feedback)}</div>` : ''}
            <div class="qr-actions">
                <label style="font-size:0.82rem; color:var(--text-light);">Marks:</label>
                <input type="number" min="0" max="${a.marks}" value="${a.marks_awarded ?? ''}" id="marks-${a.answer_id}">
                <button class="award" onclick="mark(${a.answer_id})">✓ Save mark</button>
            </div>`;
        list.appendChild(div);
    });
}

async function mark(answerId) {
    const input = document.getElementById(`marks-${answerId}`);
    const marksAwarded = parseInt(input.value, 10);
    if (isNaN(marksAwarded)) { alert('Enter a mark first'); return; }
    const res = await fetch(`/admin/api/test-review/${answerId}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ marks_awarded: marksAwarded })
    });
    const data = await res.json();
    if (!res.ok) { alert(data.error || 'Could not save'); return; }
    loadAnswers();
}

loadClassFilter();
loadAnswers();
</script>
{% endblock %}
