{% extends "admin_base.html" %}
{% block title %}Results — {{ paper.title }}{% endblock %}

{% block content %}
<style>
    .ar-container { max-width: 900px; margin: 0 auto; }
    .ar-header { margin-bottom: 1.25rem; }
    .ar-header h1 { font-size: 1.4rem; margin: 0 0 0.2rem; }
    .ar-meta { font-size: 0.85rem; color: var(--text-light); }
    .ar-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.75rem; margin-bottom: 1.5rem; }
    .ar-stat { background: var(--bg-white); border: 1px solid var(--border); border-radius: 10px; padding: 1rem 1.1rem; }
    .ar-stat .k { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-light); margin-bottom: 0.3rem; }
    .ar-stat .v { font-size: 1.4rem; font-weight: 800; color: var(--text-dark); }

    .ar-card { background: var(--bg-white); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .ar-row {
        display: flex; align-items: center; justify-content: space-between; gap: 1rem;
        padding: 0.85rem 1.1rem; border-bottom: 1px solid var(--border);
    }
    .ar-row:last-child { border-bottom: none; }
    .ar-name { font-weight: 600; }
    .ar-pill { font-size: 0.72rem; font-weight: 700; padding: 0.2rem 0.6rem; border-radius: 999px; white-space: nowrap; text-transform: uppercase; letter-spacing: 0.03em; }
    .ar-pill.not_started { background: var(--bg-light); color: var(--text-light); }
    .ar-pill.in_progress { background: rgba(217,119,6,0.15); color: #d97706; }
    .ar-pill.submitted { background: rgba(157,132,255,0.15); color: var(--primary); }
    .ar-pill.marked { background: rgba(16,185,129,0.15); color: #10b981; }
    .ar-score { font-weight: 700; font-family: ui-monospace, Consolas, monospace; }
    .ar-empty { text-align: center; padding: 2rem; color: var(--text-light); }
</style>

<div class="ar-container">
    <p><a href="/assessment/test-builder/{{ paper.id }}/assign" class="admin-btn-text">&larr; Back to assignments</a></p>
    <div class="ar-header">
        <h1>{{ paper.title }}</h1>
        <div class="ar-meta" id="arMeta">Loading…</div>
    </div>

    <div class="ar-stats">
        <div class="ar-stat"><div class="k">Assigned to</div><div class="v" id="arAssignedCount">–</div></div>
        <div class="ar-stat"><div class="k">Submitted</div><div class="v" id="arSubmittedCount">–</div></div>
        <div class="ar-stat"><div class="k">Class average</div><div class="v" id="arAvg">–</div></div>
    </div>

    <div class="ar-card">
        <div id="rosterList"><div class="ar-empty">Loading…</div></div>
    </div>
</div>

<script>
const ASSIGNMENT_ID = {{ assignment.id | tojson }};

function statusLabel(status) {
    return { not_started: 'Not started', in_progress: 'In progress', submitted: 'Provisional', marked: 'Approved' }[status] || status;
}

async function loadResults() {
    const res = await fetch(`/admin/api/test-assignments/${ASSIGNMENT_ID}/results`);
    const data = await res.json();

    document.getElementById('arMeta').textContent =
        `${data.target_label} · code ${data.access_code} · went live ${data.created_at}`;

    const roster = data.roster || [];
    document.getElementById('arAssignedCount').textContent = roster.length;
    document.getElementById('arSubmittedCount').textContent = roster.filter(r => r.status === 'submitted' || r.status === 'marked').length;
    document.getElementById('arAvg').textContent = data.avg_percentage !== null ? `${data.avg_percentage}%` : '—';

    const list = document.getElementById('rosterList');
    if (!roster.length) {
        list.innerHTML = '<div class="ar-empty">No students in this assignment.</div>';
        return;
    }
    list.innerHTML = roster.map(r => `
        <div class="ar-row">
            <div class="ar-name">${r.student_name}</div>
            <div style="display:flex; align-items:center; gap:0.85rem;">
                ${r.percentage !== null ? `<span class="ar-score">${r.marks_awarded}/${r.marks_possible} (${r.percentage}%)</span>` : ''}
                <span class="ar-pill ${r.status}">${statusLabel(r.status)}</span>
                ${r.submission_id && r.percentage !== null ? `<a class="admin-btn-text" href="/assessment/test-submissions/${r.submission_id}/report" target="_blank">View report</a>` : ''}
            </div>
        </div>
    `).join('');
}

loadResults();
</script>
{% endblock %}
