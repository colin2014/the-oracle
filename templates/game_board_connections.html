{% extends "admin_base.html" %}

{% block title %}Connections — Board{% endblock %}

{% block content %}
<div class="h-screen flex flex-col bg-gradient-to-br from-slate-50 to-slate-100">
    <!-- Header -->
    <div class="bg-white shadow px-8 py-4 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold">{{ config.title }}</h1>
            <p class="text-gray-600">Join code: <span class="font-mono font-bold text-lg">{{ session_obj.join_code }}</span></p>
        </div>
        <div class="text-right">
            <div class="text-lg font-semibold">
                Mistakes: <span id="mistakes" class="text-red-600 font-bold text-2xl">0</span>/4
            </div>
        </div>
    </div>

    <!-- Game board -->
    <div class="flex-1 flex items-center justify-center p-8">
        <div class="w-full max-w-3xl">
            <!-- Solved groups -->
            <div id="solved-groups" class="space-y-2 mb-6"></div>

            <!-- Word grid -->
            <div id="word-grid" class="grid grid-cols-4 gap-2 mb-6">
                <!-- Generated by JS -->
            </div>

            <!-- Controls -->
            <div class="flex gap-2 justify-center">
                <button onclick="shuffleBoard()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded">
                    🔀 Shuffle
                </button>
                <button onclick="submitGuess()" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded">
                    ✓ Submit
                </button>
                <button onclick="deselectAll()" class="bg-gray-400 hover:bg-gray-500 text-white font-bold py-2 px-6 rounded">
                    Clear
                </button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="p-6 border-t bg-white">
        <button onclick="finishGame()" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-6 rounded">
            End Game
        </button>
        <a href="{{ url_for('games.hub') }}" class="bg-gray-400 hover:bg-gray-500 text-white font-bold py-2 px-6 rounded ml-2">
            Back to Hub
        </a>
    </div>
</div>

<script>
let sessionId = {{ session_obj.id }};
let config = {{ config | tojson }};
let state = {{ state | tojson }};
let selectedWords = [];

const colorMap = {
    "yellow": "bg-yellow-300",
    "green": "bg-green-300",
    "blue": "bg-blue-300",
    "purple": "bg-purple-300"
};

async function getState() {
    const res = await fetch(`/class-games/session/${sessionId}/board/state`);
    return res.json();
}

async function sendAction(action, extra = {}) {
    const res = await fetch(`/class-games/session/${sessionId}/action`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action, ...extra })
    });
    return res.json();
}

function renderBoard() {
    const board = state.board || [];
    const solved = state.solved_groups || [];
    const grid = document.getElementById("word-grid");
    const groupsDisplay = document.getElementById("solved-groups");

    grid.innerHTML = board.map((word, idx) => `
        <button onclick="toggleWord(${idx})" class="word-btn ${selectedWords.includes(idx) ? 'ring-4 ring-yellow-400' : ''}
            bg-white hover:bg-gray-50 border-2 border-gray-300 rounded-lg p-4 font-bold text-lg cursor-pointer transition">
            ${word}
        </button>
    `).join("");

    // Show solved groups
    groupsDisplay.innerHTML = config.groups.filter((g, i) => solved.includes(i))
        .map(g => `
            <div class="p-4 rounded-lg text-white font-bold ${colorMap[g.color]}">
                ${g.words.join(" · ")} <span class="text-sm">(${g.title})</span>
            </div>
        `).join("");
}

function toggleWord(idx) {
    if (selectedWords.includes(idx)) {
        selectedWords = selectedWords.filter(i => i !== idx);
    } else {
        if (selectedWords.length < 4) {
            selectedWords.push(idx);
        }
    }
    renderBoard();
}

function deselectAll() {
    selectedWords = [];
    renderBoard();
}

async function shuffleBoard() {
    await sendAction("shuffle");
    state = await getState();
    selectedWords = [];
    renderBoard();
}

async function submitGuess() {
    if (selectedWords.length !== 4) {
        alert("Select exactly 4 words.");
        return;
    }
    const result = await sendAction("submit_guess");
    state = await getState();
    selectedWords = [];
    renderBoard();

    if (!result.correct) {
        alert(`❌ Wrong! Mistakes: ${state.mistakes}/4`);
        if (state.mistakes >= 4) {
            alert("Game Over! Out of mistakes.");
        }
    } else {
        alert("✓ Correct!");
        if (state.phase === "finished") {
            alert("🎉 You solved all four groups!");
        }
    }
}

async function finishGame() {
    if (confirm("End the game?")) {
        await sendAction("finish");
        window.location.href = "{{ url_for('games.hub') }}";
    }
}

async function updateDisplay() {
    state = await getState();
    document.getElementById("mistakes").textContent = state.mistakes || 0;
    renderBoard();
}

setInterval(updateDisplay, 1000);
updateDisplay();
</script>
{% endblock %}
